name: quick-actions-unity CI

# Unity asset verified WITHOUT Unity: tools/verify.sh generates .meta files,
# compiles the C# against UnityEngine/UnityEditor stubs (9 configs), runs the
# NUnit suite via `dotnet test`, and compiles the Android plugin against Android
# SDK stubs. The iOS .mm and on-device behaviour still need a real Unity build
# (see PRODUCTION_READINESS.md). See .verify/README.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/quick-actions-unity.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/quick-actions-unity.yml"

defaults:
  run:
    working-directory: .

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify (meta + 9 C# configs + unit tests + Android plugin)
        run: tools/verify.sh
      - name: Pack .unitypackage (reproducible, no Unity needed)
        run: python3 tools/pack_unitypackage.py
      # The pack is byte-reproducible, so any diff means the committed artifact
      # went stale relative to the sources in this commit — fail loud.
      - name: Committed artifact must match the sources
        run: git diff --exit-code -- dist~/QuickActions.unitypackage
      - uses: actions/upload-artifact@v6
        with:
          name: QuickActions.unitypackage
          path: dist~/QuickActions.unitypackage
          if-no-files-found: error
