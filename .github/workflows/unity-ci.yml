name: unity

# Real-Unity CI via GameCI (game.ci): the stub harness in ci.yml proves the C#
# type-checks; this workflow runs the REAL editor — Unity Test Runner (EditMode)
# on all three Examples~ testbeds, an Android IL2CPP APK per testbed (aapt2 then
# asserts the package's baked shortcuts, keep file and trampoline really are in
# it) fed into the adb device smoke, and an iOS Simulator-SDK Xcode export per
# testbed with an unsigned xcodebuild compile on macOS for the lines whose
# simulator support allows it. A second iOS pair, `ios-export-coex` /
# `ios-simulator-coex`, re-exports two of those testbeds with a mock HOST stacked
# on the package — an app-controller subclass, a category `+load` swizzle and a
# GoogleUtilities-style isa proxy (`Examples~/Coexistence/`) — and asserts on what
# the native layer actually did, which is the one thing the plain simulator leg
# (process still alive) cannot see. One further Android leg, `android-shrink-verify`,
# exports the Gradle project on 2022.3 and runs the resource shrinker's own
# task (`:launcher:shrinkReleaseRes`, never assembleRelease), reading the
# stripped `.ap_` it emits, to settle the question no APK leg can — whether
# AGP's resource shrinker honours the keep rule the package ships for its icon
# drawables. And `gate-off` builds the 2022.3 testbed again with
# QUICKACTIONS_ENABLED OFF (an APK and an iOS export), asserts the package left
# nothing in either, and diffs the two APKs — the package's measured footprint.
#
# EVERY leg runs on every code push and PR — the EditMode tests (three pinned
# testbed legs plus a unity6-latest canary that resolves the newest Unity 6
# GameCI image at run time and upgrade-opens Testbed6 with it) and the
# build-heavy ones alike: Android IL2CPP, the emulator smoke, the iOS export
# and its macOS compile, the shrink experiment.
#
# The heavy legs used to be dispatch/cron-only, on a "split by cost" rationale
# that measurement disproved: run 25 ran the whole matrix — 17 jobs, macOS
# included — in 13.4 minutes of wall clock, and GitHub billed 0 ms for all of
# it, because runner minutes on a public repo are free. What that gating
# actually bought was a manual step between writing a change and learning
# whether it works — which is how a test that passes headlessly and fails in a
# real Editor reached main.
#
# That 13.4 minutes was measured BEFORE the licence cap below. Chained, run 31
# took 29 minutes without the shrink leg, and the 2026-08-31 cron (run 35) took
# 38 for the whole matrix, shrink leg included. The argument is unchanged —
# free minutes, no manual step — but the number is, so do not quote 13 minutes.
#
# Docs-only changes still trigger nothing (paths filter below), so the bill for
# a README edit stays zero legs. The weekly cron remains, and is not redundant:
# it catches drift with no commit behind it — a new Unity patch the canary
# picks up, a changed base image, an expired credential.
# (Its first real catch, run 37 on 2026-09-01: 6000.6.0f1's editor aborts in a
# container with Docker's 64 MB /dev/shm — see the shared-memory step in each
# Unity job.)
#
# Public repo: GitHub-hosted runners, macOS included, are free.
#
# Fork PRs are safe by construction: GitHub does not pass secrets to a
# workflow triggered from a fork, so the licence gate below reports "missing"
# and every Unity job SKIPS — the run is green and no secret was ever within
# reach of the fork's code. Nothing here uses pull_request_target, which is
# the trigger that WOULD hand secrets to untrusted code.
#
# Secrets (Settings ▸ Secrets and variables ▸ Actions) — see
# https://game.ci/docs/github/activation:
#   UNITY_LICENSE   contents of Unity_lic.ulf — Unity Hub ▸ Preferences ▸
#                   Licenses ▸ Add ▸ "Get a free personal license", then copy
#                   ~/.local/share/unity3d/Unity/Unity_lic.ulf (Linux),
#                   /Library/Application Support/Unity/Unity_lic.ulf (macOS) or
#                   C:\ProgramData\Unity\Unity_lic.ulf (Windows). The .ulf is
#                   not tied to an editor version. (The old license.unity3d.com
#                   manual-activation flow is dead for Personal licences.)
#   UNITY_EMAIL     the Unity account e-mail (must be the e-mail, not a name)
#   UNITY_PASSWORD  its password (avoid special characters — known GameCI issue)
#   UNITY_SERIAL    Professional licences only; leave unset for Personal.
# Without the secrets every Unity job is SKIPPED (gate job below). On a fork or
# Dependabot PR that is expected and the run stays green; on any other event
# the gate FAILS, so a run with no editor behind it never reports green.
#
# Licence seats: at most UNITY_MAX_PARALLEL Unity activations run at once —
# repository variable, default 2 if unset, so the number is tunable from
# Settings without a commit. (The `|| '2'` default is spelled out at each of
# the four max-parallel lines — `strategy:` cannot read `env:` — and quoted in
# README.md and tools~/device-smoke/README.md; change all six together.)
# Two mechanisms together produce that number, and neither alone would:
#   * the seven Unity jobs are chained with `needs:` (tests -> android-build ->
#     ios-export -> ios-export-coex -> tests-unity6-latest ->
#     android-shrink-verify -> gate-off), so exactly ONE of them is ever
#     eligible. max-parallel is a matrix-only key — it cannot span job
#     definitions — so without the chain the floor is seven.
#   * max-parallel on each matrix caps that one job's legs.
# The chain uses `!cancelled()` rather than the implicit success(), so a red
# tests leg still lets the Android build run, exactly as before; the
# no-secrets path still propagates as skipped.
#
# What this costs, measured rather than guessed: 29 minutes on run 31 (before
# the shrink leg joined the chain) and 38 on run 35 for the whole matrix,
# against 13.4 unchained. Runner minutes are free
# on a public repo, so the price is wall clock only. To undo, delete the three
# max-parallel lines and put every Unity job back on `needs: license` with the
# plain gate.
#
# What the evidence says: no run of this workflow has EVER failed on Unity
# activation. Across 30 runs, no game-ci step has conclusion "failure" — every
# red is downstream of a successful activation. Run 25 activated all eleven
# legs simultaneously and every one logged "Successfully returned ULF license".
# GameCI hardcodes one machine-id into its Linux images, so parallel containers
# present to Unity as the same machine, and it states the split in one
# sentence: "This is not an issue for free licenses, but for paid licenses, you
# will need to be mindful of starting too many parallel jobs as activation will
# fail" (https://game.ci/docs/docker/docker-images/#concurrent-builds-on-windows-and-macos
# — NOT the FAQ, which an earlier version of this comment cited; the FAQ does
# not contain the word "seat"). This repo uses a Personal .ulf with no
# UNITY_SERIAL, so the hard "two activations per key" limit that GameCI's own
# CI hit (game-ci/unity-builder#516) does not bind these credentials.
# The cap is therefore a deliberate margin, not a fix for an observed failure.
#
# A transient "Unity exits -1 within seconds" is, per GameCI's troubleshooting
# page, a concurrent-activation hiccup: re-run the job after ~30s, and never
# delete the Library cache for it. That symptom has not appeared here.

on:
  workflow_dispatch:
  schedule:
    # Weekly regression net for the full set; runs from the default branch only.
    - cron: "0 3 * * 1"
  # Code only — a docs/store commit must not spend an hour of Unity runners.
  # The two lists are duplicated on purpose: GitHub accepts a YAML anchor here,
  # but actionlint cannot resolve the alias, and a linter that rejects our own
  # workflow is worse than seven repeated lines. Keep them in sync.
  push:
    branches: [main]
    paths:
      - "Runtime/**"
      - "Editor/**"
      - "Plugins/**"
      - "Tests/**"
      - "Examples~/**"
      - "Samples~/**"
      - "package.json"
      - "tools~/device-smoke/**"
      - ".github/workflows/unity-ci.yml"
  pull_request:
    paths:
      - "Runtime/**"
      - "Editor/**"
      - "Plugins/**"
      - "Tests/**"
      - "Examples~/**"
      - "Samples~/**"
      - "package.json"
      - "tools~/device-smoke/**"
      - ".github/workflows/unity-ci.yml"

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.ref }}
  # A new push to a PR supersedes its in-flight run (saves minutes and licence
  # seat contention); a dispatch or the weekly cron is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The `secrets` context is not readable in a job-level `if`, so this gate
  # turns "are the licence secrets configured?" into a job output the Unity
  # jobs can condition on.
  license:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          # Passed through env, never interpolated into the script body: these
          # carry event-payload strings.
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if { [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; } \
             && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            # Absent secrets are EXPECTED on a fork or Dependabot PR — GitHub
            # withholds them by design there, and skipping every Unity job is the
            # correct, green outcome. On any other event they are missing because
            # something broke (a rotated .ulf, a deleted secret, an expired
            # licence), and staying green would report "all Unity checks passed"
            # for a run in which no editor ever opened. Fail the gate there, so
            # the workflow says what actually happened.
            if [ "$EVENT" = 'pull_request' ] \
               && { [ "$HEAD_REPO" != "$THIS_REPO" ] || [ "$ACTOR" = 'dependabot[bot]' ]; }; then
              echo "::notice::No Unity licence secrets in reach — every Unity job was skipped (expected on a fork or Dependabot PR, where GitHub withholds secrets by design)."
            else
              echo "::error::Unity licence secrets are missing on a trusted event ($EVENT) — every Unity job would be skipped and this run would otherwise report green. Re-add UNITY_LICENSE + UNITY_EMAIL + UNITY_PASSWORD (or UNITY_SERIAL); see the header of .github/workflows/unity-ci.yml."
              exit 1
            fi
          fi

  # Unity Test Runner (EditMode) on each testbed: the same 74-test suite the
  # README quotes, on the real editor of each supported line. The testbeds
  # already carry `testables` and QUICKACTIONS_ENABLED, so no setup step —
  # opening the project IS the test. (GameCI test-runner is Linux-only.)
  tests:
    name: tests (${{ matrix.testbed.name }})
    needs: license
    if: needs.license.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write # unity-test-runner publishes a check run per matrix leg
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.UNITY_MAX_PARALLEL || '2') }}
      matrix:
        testbed:
          - { name: "2021.3", path: Examples~/Testbed2021 }
          - { name: "2022.3", path: Examples~/Testbed2022 }
          - { name: "unity6", path: Examples~/Testbed6 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Unity 6000.6's editor asks for 1 GB of /dev/shm at start-up (its asset
      # database's UDS client: "Requested 1073741824 bytes, but only 67108864
      # available … run the container with --shm-size=1025M") and aborts without
      # it; Docker's default is 64 MB and GameCI's actions pass no --shm-size, so
      # the daemon's default is raised instead. Merged into the runner's existing
      # daemon.json rather than overwriting it (the image ships cgroup settings
      # there). Same step in every job that runs an editor in a container — the
      # unity6-latest canary was the first to hit it (run 37, 2026-09-01), and
      # the pinned legs will the day a testbed moves to 6.6+.
      - name: Give Unity's container the shared memory 6000.6+ needs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          path = "/etc/docker/daemon.json"
          cfg = json.load(open(path)) if os.path.exists(path) else {}
          cfg["default-shm-size"] = "2g"
          with open("daemon.json.new", "w") as f:
              json.dump(cfg, f, indent=2)
          print(json.dumps(cfg, indent=2))
          PY
          sudo mv daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.Name}}: docker restarted, default shm raised' \
            || { echo "docker did not come back after the restart"; exit 1; }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.testbed.path }}/Library
          key: Library-${{ matrix.testbed.name }}-tests-${{ hashFiles(format('{0}/Packages/**', matrix.testbed.path), format('{0}/ProjectSettings/**', matrix.testbed.path)) }}
          restore-keys: |
            Library-${{ matrix.testbed.name }}-tests-
            Library-${{ matrix.testbed.name }}-
      - id: tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ matrix.testbed.path }}
          testMode: EditMode
          checkName: unity tests (${{ matrix.testbed.name }})
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results-${{ matrix.testbed.name }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 14

  # Canary: the same EditMode suite on the NEWEST Unity 6 editor that has a
  # GameCI image — resolved at run time from Docker Hub, so nobody bumps a pin
  # when Unity ships 6.6/6.7 (quarterly updates, per Unity's release model).
  # Testbed6 stays serialized at 6.3 LTS and the newer editor upgrade-opens
  # it, which is the supported direction; the Library cache is keyed by the
  # resolved version because that upgrade rewrites it. This leg exists to see
  # "the latest editor broke the package" before users do. The repo has no
  # required checks, so a red here blocks nothing — it IS the early warning.
  tests-unity6-latest:
    name: tests (unity6-latest)
    needs: [license, ios-export-coex]
    if: ${{ !cancelled() && needs.license.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write # unity-test-runner publishes a check run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Newest 6000.x that unityci/editor actually ships, not newest Unity:
      # a version the GameCI images lag on would fail the docker pull, so the
      # image registry is the honest source. Walks minors downward and takes
      # the highest patch of the first minor that has any -base- image; dies
      # loudly (never silently pins backward) if nothing resolves.
      - name: Resolve the newest Unity 6 with a GameCI image
        id: resolve
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          # Docker Hub's anonymous tag API is rate-limited, and this leg runs on
          # every push and PR: one 429 would turn the canary red for a reason that
          # has nothing to do with the package. Retry only the transient statuses —
          # a 404 or a changed JSON shape must still fail immediately, so the
          # "refuse to guess a version" contract below keeps its teeth.
          def _get(url, attempts=4):
              for i in range(attempts):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code not in (429, 500, 502, 503, 504) or i == attempts - 1:
                          raise
                      print("docker hub HTTP %d, retrying" % e.code, file=sys.stderr)
                  except urllib.error.URLError as e:
                      if i == attempts - 1:
                          raise
                      print("docker hub unreachable (%s), retrying" % e, file=sys.stderr)
                  time.sleep(2 ** i)

          def pages(url, limit=5):
              n = 0
              while url and n < limit:
                  d = _get(url)
                  yield d
                  url = d.get("next")
                  n += 1

          best = None
          for minor in range(20, -1, -1):
              versions = set()
              base = ("https://hub.docker.com/v2/repositories/unityci/editor/tags"
                      "?page_size=100&name=ubuntu-6000.%d." % minor)
              for d in pages(base):
                  for t in d.get("results", []):
                      m = re.match(r"^ubuntu-(6000\.%d\.\d+f\d+)-base-" % minor, t["name"])
                      if m:
                          versions.add(m.group(1))
              if versions:
                  best = max(versions,
                             key=lambda v: [int(x) for x in re.findall(r"\d+", v)])
                  break
          if not best:
              print("no unityci/editor ubuntu-6000.* -base- tag found on Docker Hub "
                    "(API change? outage?) — refusing to guess a version.",
                    file=sys.stderr)
              raise SystemExit(1)
          print("resolved Unity %s" % best, file=sys.stderr)
          print("version=%s" % best)
          PY
      # Unity 6000.6's editor asks for 1 GB of /dev/shm at start-up (its asset
      # database's UDS client: "Requested 1073741824 bytes, but only 67108864
      # available … run the container with --shm-size=1025M") and aborts without
      # it; Docker's default is 64 MB and GameCI's actions pass no --shm-size, so
      # the daemon's default is raised instead. Merged into the runner's existing
      # daemon.json rather than overwriting it (the image ships cgroup settings
      # there). Same step in every job that runs an editor in a container — the
      # unity6-latest canary was the first to hit it (run 37, 2026-09-01), and
      # the pinned legs will the day a testbed moves to 6.6+.
      - name: Give Unity's container the shared memory 6000.6+ needs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          path = "/etc/docker/daemon.json"
          cfg = json.load(open(path)) if os.path.exists(path) else {}
          cfg["default-shm-size"] = "2g"
          with open("daemon.json.new", "w") as f:
              json.dump(cfg, f, indent=2)
          print(json.dumps(cfg, indent=2))
          PY
          sudo mv daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.Name}}: docker restarted, default shm raised' \
            || { echo "docker did not come back after the restart"; exit 1; }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Examples~/Testbed6/Library
          key: Library-unity6latest-${{ steps.resolve.outputs.version }}-tests-${{ hashFiles('Examples~/Testbed6/Packages/**', 'Examples~/Testbed6/ProjectSettings/**') }}
          restore-keys: |
            Library-unity6latest-${{ steps.resolve.outputs.version }}-tests-
      # The 6000.6 editor has died with exit 137 (SIGKILL) during its OWN
      # start-up — at "Begin MonoManager ReloadAssembly", before the runner
      # executed a single test — on main run 41 and PR #16 run 53, and started
      # fine on the runs between. A start that never reached the suite says
      # nothing about the package, so it gets ONE more attempt. The gate is the
      # results file being absent, never the exit code: an attempt that wrote
      # editmode-results.xml (a real test failure, or the editor dying with
      # results on disk) is final. The verdict step below turns the job red when
      # the last attempt did not pass; continue-on-error only keeps the first
      # attempt from ending the job before that step can run.
      - id: tests
        continue-on-error: true
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: Examples~/Testbed6
          unityVersion: ${{ steps.resolve.outputs.version }}
          testMode: EditMode
          checkName: unity tests (unity6-latest, ${{ steps.resolve.outputs.version }})
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - id: tests-retry
        name: Start the editor once more if it died before producing any results
        if: ${{ steps.tests.outcome == 'failure' && hashFiles('artifacts/editmode-results.xml') == '' }}
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: Examples~/Testbed6
          unityVersion: ${{ steps.resolve.outputs.version }}
          testMode: EditMode
          checkName: unity tests (unity6-latest, ${{ steps.resolve.outputs.version }}, retry)
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verdict (the last attempt must have passed)
        if: ${{ steps.tests.outcome == 'failure' }}
        env:
          FIRST: ${{ steps.tests.outcome }}
          RETRY: ${{ steps.tests-retry.outcome }}
        run: |
          echo "unity6-latest: first attempt $FIRST, retry $RETRY"
          case "$RETRY" in
            success) echo "the retried start passed; the first death was the editor's, not the suite's" ;;
            skipped) echo "not retried: the first attempt produced results, so its failure is the suite's"; exit 1 ;;
            *) echo "the retry did not pass either"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results-unity6-latest
          path: ${{ steps.tests-retry.outputs.artifactsPath || steps.tests.outputs.artifactsPath }}
          retention-days: 14

  # Development APK per testbed via the testbed's own CLI entry point
  # (TestbedBuilder.BuildAndroidPhone: IL2CPP, ARMv7+ARM64 — installs on any
  # handset, and on the x86_64 CI emulator through its ARM translation, the
  # same configuration device-ci.yml was designed around). The Demo sample is
  # copied in first because the build scene lives at
  # Assets/Samples/QuickActionsDemo/ — that copy dirties the checkout, hence
  # allowDirtyBuild. versioning:None keeps the builder from rewriting the
  # project version out of git history.
  #
  # Two legs do more than the others, both flagged in the matrix below:
  #   2022.3 (androidlib) also proves the recipe README.md gives a CONSUMER for
  #     their own icons. Testbed2022 carries an .androidlib under Assets/ and a
  #     second one inside an embedded UPM package, and the assertion step
  #     requires both their drawables in the APK plus the absence of a decoy
  #     planted at the .androidlib root. That recipe had never been run — it
  #     rested on Unity's docs and on reading Unity's own notifications package.
  #   unity6 (incremental) builds the player TWICE over the same project
  #     directory and asserts the second APK as strictly as the first, because
  #     everything CI knows about the package's Android output it knows from
  #     clean builds on fresh runners.
  android-build:
    name: android build (${{ matrix.testbed.name }})
    needs: [license, tests]
    if: ${{ !cancelled() && needs.license.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.UNITY_MAX_PARALLEL || '2') }}
      matrix:
        # Two per-leg flags, both read by steps below rather than by another job:
        #   androidlib  — this testbed carries the consumer-side .androidlib
        #                 fixtures, so the assertion step also holds the README's
        #                 own-icon recipe to the APK. 2022.3 only, because that
        #                 line exports AGP 7.1.2, where an .androidlib may still
        #                 name itself with the manifest's `package` attribute
        #                 (AGP 8 removed it, and Testbed6 exports AGP 8.x).
        #   incremental — build the player TWICE in this job and assert the
        #                 second APK too. Unity 6 only: the ROADMAP's open
        #                 question is about Unity 6's Gradle staging.
        testbed:
          - { name: "2021.3", path: Examples~/Testbed2021 }
          - { name: "2022.3", path: Examples~/Testbed2022, androidlib: true }
          - { name: "unity6", path: Examples~/Testbed6, incremental: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import the Demo sample into the testbed
        env:
          TESTBED: ${{ matrix.testbed.path }}
        run: |
          mkdir -p "$TESTBED/Assets/Samples/QuickActionsDemo"
          cp -R Samples~/Demo/. "$TESTBED/Assets/Samples/QuickActionsDemo/"
      # Unity 6000.6's editor asks for 1 GB of /dev/shm at start-up (its asset
      # database's UDS client: "Requested 1073741824 bytes, but only 67108864
      # available … run the container with --shm-size=1025M") and aborts without
      # it; Docker's default is 64 MB and GameCI's actions pass no --shm-size, so
      # the daemon's default is raised instead. Merged into the runner's existing
      # daemon.json rather than overwriting it (the image ships cgroup settings
      # there). Same step in every job that runs an editor in a container — the
      # unity6-latest canary was the first to hit it (run 37, 2026-09-01), and
      # the pinned legs will the day a testbed moves to 6.6+.
      - name: Give Unity's container the shared memory 6000.6+ needs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          path = "/etc/docker/daemon.json"
          cfg = json.load(open(path)) if os.path.exists(path) else {}
          cfg["default-shm-size"] = "2g"
          with open("daemon.json.new", "w") as f:
              json.dump(cfg, f, indent=2)
          print(json.dumps(cfg, indent=2))
          PY
          sudo mv daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.Name}}: docker restarted, default shm raised' \
            || { echo "docker did not come back after the restart"; exit 1; }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.testbed.path }}/Library
          key: Library-${{ matrix.testbed.name }}-android-${{ hashFiles(format('{0}/Packages/**', matrix.testbed.path), format('{0}/ProjectSettings/**', matrix.testbed.path)) }}
          restore-keys: |
            Library-${{ matrix.testbed.name }}-android-
            Library-${{ matrix.testbed.name }}-
      - uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ matrix.testbed.path }}
          targetPlatform: Android
          buildMethod: TestbedBuilder.BuildAndroidPhone
          versioning: None
          allowDirtyBuild: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quickactions-demo-apk-${{ matrix.testbed.name }}
          path: ${{ matrix.testbed.path }}/Builds/QuickActionsDemo-phone.apk
          if-no-files-found: error
          retention-days: 14
      # A SECOND player build, over the project directory the first one just
      # left behind — the one thing this workflow has never done. Every leg
      # elsewhere starts from a fresh runner, so what CI proves about the
      # package's Android output is only ever proven about a CLEAN Gradle
      # project. An incremental build is a different code path: Unity reuses
      # the staged Gradle project under Library/, and whether its
      # IPostGenerateGradleAndroidProject callbacks re-run — or whether files
      # they wrote and Unity did not declare survive a re-stage — decides
      # whether the icons, res/raw/quickactions_keep.xml, the baked shortcut
      # resources and the trampoline <activity> are still in the second APK.
      # Unity 6 because that is the line where Unity moved its own packages to
      # AndroidProjectFilesModifier "for better compatibility with incremental
      # build", so it is where the answer could differ.
      #
      # A separate output path rather than an overwrite: incrementality lives
      # in Library/, not in the APK's file name, and keeping both APKs lets a
      # human diff them. Shape copied from the gate-off job, which already runs
      # unity-builder three times in one job — same pinned action, same four
      # secrets, and the same two inputs that make a repeat invocation work
      # (versioning: None, so the builder does not rewrite the project version
      # between runs; allowDirtyBuild: true, because the Demo import and the
      # first build's own output have dirtied the checkout).
      - name: Build the Android player a second time (incremental)
        if: ${{ matrix.testbed.incremental }}
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ matrix.testbed.path }}
          targetPlatform: Android
          buildMethod: TestbedBuilder.BuildAndroidPhoneSecond
          versioning: None
          allowDirtyBuild: true
      # Its own artifact, uploaded before the assertion for the same reason the
      # first one is: the assertion is the step meant to turn red, and red must
      # not discard the bytes it judged.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ matrix.testbed.incremental }}
        with:
          name: quickactions-demo-apk-${{ matrix.testbed.name }}-incremental
          path: ${{ matrix.testbed.path }}/Builds/QuickActionsDemo-phone-2.apk
          if-no-files-found: error
          retention-days: 14
      # The upload above runs FIRST on purpose: the assertion below is the step
      # meant to turn red, and red must not discard its own evidence — a failed
      # assertion with no APK artifact cannot be re-examined with a local aapt2.
      # The upload keeps its implicit success() gate relative to the BUILD, and
      # if-no-files-found: error still catches a build that claimed success
      # while writing the APK elsewhere.
      # "The package's Android bake really reaches a shipped APK" was proven
      # once, by hand, with one aapt2 session on one machine (README "Status").
      # This makes it an assertion on every line, every run — the half of that
      # proof a machine can do, leaving only "a launcher renders them" for human
      # eyes. Every miss prints the dump it could not match, so a surprise
      # arrives as evidence rather than a bare exit 1. Green on all three lines
      # in every heavy run since the 2026-08-21 dispatch.
      - name: Assert the APK carries the package's baked output
        env:
          APK: ${{ matrix.testbed.path }}/Builds/QuickActionsDemo-phone.apk
          APK2: ${{ matrix.testbed.path }}/Builds/QuickActionsDemo-phone-2.apk
          INCREMENTAL: ${{ matrix.testbed.incremental }}
          ANDROIDLIB: ${{ matrix.testbed.androidlib }}
        run: |
          set -euo pipefail
          # Ubuntu runners preinstall the Android SDK, but the build-tools
          # version drifts with the image, so take the newest one present
          # instead of pinning a directory name.
          # (`find`, not `ls */aapt2`: shellcheck rejects parsing ls output, and
          # actionlint shellchecks every run: block in this workflow.)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          # `|| true`: with an unset/absent SDK the find exits non-zero, and
          # under pipefail that would kill this step through `set -e` with no
          # message at all — the empty-AAPT2 branch below must get to speak.
          AAPT2="$(find "$SDK/build-tools" -maxdepth 2 -name aapt2 -type f 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$AAPT2" ]; then
            echo "no aapt2 under '${SDK:-<ANDROID_HOME and ANDROID_SDK_ROOT both unset>}'/build-tools/*/."
            echo "The runner image no longer ships the Android SDK where this step expects it."
            ls -la "${SDK:-/opt}"/build-tools 2>/dev/null || true
            exit 1
          fi
          # One reader, applied to every APK this leg produced, rather than the
          # forty lines below duplicated for the unity6 leg's second, incremental
          # build. Same function shape as the gate-off job's `scan`: the caller
          # names the file, everything else is read from the enclosing scope.
          assert_apk() {
            local apk="$1" label="$2"
            local res manifest dex missing=""
            echo "--- asserting the $label APK: $apk ---"
            if [ ! -f "$apk" ]; then
              echo "no APK at $apk — the build reported success but wrote nothing here."
              ls -la "$(dirname "$apk")" 2>/dev/null || true
              exit 1
            fi
            echo "using $AAPT2 on $apk"
            # Capture then `case` — never `| grep -q`: grep exits at its first
            # match and the SIGPIPE that sends upstream becomes a spurious failure
            # under `set -o pipefail` (same rule as the adb smoke).
            res="$("$AAPT2" dump resources "$apk")" \
              || { echo "aapt2 could not read the resource table of $apk"; exit 1; }
            # xml/ + string/ are the static-shortcut bake (the testbeds' demo ships
            # 3, so qa_short_0 must exist); raw/ is 0.4.7's resource-shrinker keep
            # file, which every enabled Android build writes; drawable/ is 0.5.0's
            # built-in icons, written unconditionally by the same post-processor —
            # the Demo uses exactly these four IconTypes, so a missing one here is
            # a blank square on the emulator's launcher.
            local wants="xml/quickactions_shortcuts raw/quickactions_keep string/qa_short_0"
            local icon layer
            for icon in add compose favorite play; do
              # Each icon is ONE resource name carrying two config-qualified files
              # (drawable/ for API 25, drawable-anydpi-v26/ for the <adaptive-icon>),
              # so the name below says nothing about which variants linked. The two
              # LAYERS do: they exist only because the -v26 file references them, and
              # an unresolved @drawable is a hard aapt2 link error — so all three
              # names present is the resource table's account of the adaptive variant
              # having shipped.
              for layer in "$icon" "${icon}_background" "${icon}_foreground"; do
                wants="$wants drawable/ic_quickaction_builtin_$layer"
              done
            done
            for want in $wants; do
              case "$res" in
                *"$want"*) echo "ok: resource table carries $want" ;;
                *) missing="$missing $want" ;;
              esac
            done
            if [ -n "$missing" ]; then
              echo "MISSING from the APK resource table:$missing"
              echo "--- every quickactions/qa_short line aapt2 did report ---"
              printf '%s\n' "$res" | grep -iE 'quickactions|qa_short' || echo "(none at all)"
              echo "--- first 200 lines of the resource dump ---"
              printf '%s\n' "$res" | head -200
              exit 1
            fi
            # 2022.3 only: the recipe README.md gives a consumer for their OWN
            # icons — a bare .androidlib (no build.gradle of its own) — which
            # until this leg rested on Unity's documentation and on reading
            # Unity's first-party com.unity.mobile.notifications, never on a
            # build. The first run proved the documented layout WRONG: Unity
            # generates the Gradle module for a bare androidlib with the manifest
            # and res/ at the ROOT, and the src/main/ layout (which Unity's own
            # package can use only because it ships a build.gradle) is silently
            # ignored. ROADMAP sub-items (a), (b) and (d), as measured:
            #   (a) Assets/QuickActionIcons.androidlib/res/drawable/ must reach
            #       the APK                     -> ic_quickaction_search PRESENT
            #   (d) the same root layout inside an embedded UPM package,
            #       Packages/com.quickactions.testlib/Runtime/Android/Plugins/
            #                                   -> ic_quickaction_frompkg PRESENT
            #   (b) src/main/res/ in a bare .androidlib is silently dropped —
            #       README's first trap, inverted from what it first said
            #                                   -> ic_quickaction_decoy ABSENT
            # The built-in drawables just asserted above are the positive
            # control: they prove this dump is being read correctly, so a miss
            # below is about the .androidlib and not about aapt2. And (b) is
            # ASSERTED, not assumed — without it a green run would equally
            # describe a build that picks src/main/res/ up after all.
            if [ "${ANDROIDLIB:-}" = "true" ]; then
              local consumer_missing=""
              for want in drawable/ic_quickaction_search drawable/ic_quickaction_frompkg; do
                case "$res" in
                  *"$want"*) echo "ok: resource table carries $want (an .androidlib delivered it)" ;;
                  *) consumer_missing="$consumer_missing $want" ;;
                esac
              done
              if [ -n "$consumer_missing" ]; then
                echo "MISSING from the APK resource table:$consumer_missing"
                echo "The .androidlib recipe README.md documents did not reach this APK."
                echo "ic_quickaction_search comes from Assets/QuickActionIcons.androidlib/res/;"
                echo "ic_quickaction_frompkg from the embedded package com.quickactions.testlib."
                echo "--- every ic_quickaction_ line aapt2 did report ---"
                printf '%s\n' "$res" | grep -i 'ic_quickaction' || echo "(none at all)"
                exit 1
              fi
              case "$res" in
                *ic_quickaction_decoy*)
                  echo "UNEXPECTED: ic_quickaction_decoy IS in the APK resource table."
                  echo "That file sits under src/main/res/ in a bare .androidlib, which"
                  echo "README.md documents as silently ignored — green build, no warning,"
                  echo "no icon. Either Unity changed or the trap is not real: fix"
                  echo "README.md's 'Three traps worth knowing' rather than this check."
                  printf '%s\n' "$res" | grep -i 'ic_quickaction' || true
                  exit 1
                  ;;
                *) echo "ok: ic_quickaction_decoy is ABSENT — src/main/res/ in a bare .androidlib is dropped" ;;
              esac
            fi
            manifest="$("$AAPT2" dump xmltree --file AndroidManifest.xml "$apk" 2>&1)" \
              || { echo "aapt2 could not dump AndroidManifest.xml of $apk:"; printf '%s\n' "$manifest"; exit 1; }
            # The trampoline <activity> is injected by the package's manifest
            # injector, and android.app.shortcuts is the meta-data that points the
            # launcher at the baked static set. Neither is written by hand
            # anywhere in the testbeds, so both are the package's own output.
            for want in QuickActionsTrampolineActivity android.app.shortcuts; do
              case "$manifest" in
                *"$want"*) echo "ok: manifest carries $want" ;;
                *)
                  echo "MISSING from the APK manifest: $want"
                  echo "--- AndroidManifest.xml as built ---"
                  printf '%s\n' "$manifest"
                  exit 1
                  ;;
              esac
            done
            # Resources and manifest are both written by the C# post-processor, so
            # everything above would still pass with NONE of the package's Java in
            # the APK — a manifest declaring an activity the dex does not contain,
            # i.e. a crash on the first tap. The .java plugins reach a build only
            # through their .meta platform flags, which nothing else here checks.
            dex="$(unzip -p "$apk" 'classes*.dex' 2>/dev/null | strings -a || true)"
            if [ -z "$dex" ]; then
              echo "no readable classes*.dex in $apk — cannot verify the Java landed."
              unzip -l "$apk" | head -40
              exit 1
            fi
            for want in com/emindeniz99/quickactions/QuickActionsBridge \
                        com/emindeniz99/quickactions/QuickActionsTrampolineActivity; do
              case "$dex" in
                *"$want"*) echo "ok: dex carries $want" ;;
                *)
                  echo "MISSING from classes.dex: $want"
                  echo "The manifest declares this class but the APK does not contain it —"
                  echo "check Plugins/Android/*.java.meta (the Android platform flag) and"
                  echo "that no minification stripped it."
                  exit 1
                  ;;
              esac
            done
          }
          assert_apk "$APK" "first (clean)"
          # The unity6 leg built a second time over the same project directory.
          # It gets the SAME assertions, not a shorter set: the whole question
          # is whether an incremental build still writes everything a clean one
          # does, so anything this loop skipped would be the thing that broke.
          if [ "${INCREMENTAL:-}" = "true" ]; then
            assert_apk "$APK2" "second (incremental)"
          fi
      # Which of the two APKs was which is the whole finding of the incremental
      # leg, and a job log nobody opens is not where it belongs. Runs after the
      # assertion (implicit success()), so what it claims is a pass that
      # happened, never a pass it is predicting.
      - name: Record the incremental build in the job summary
        if: ${{ matrix.testbed.incremental }}
        env:
          APK: ${{ matrix.testbed.path }}/Builds/QuickActionsDemo-phone.apk
          APK2: ${{ matrix.testbed.path }}/Builds/QuickActionsDemo-phone-2.apk
          TESTBED_NAME: ${{ matrix.testbed.name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          first, second = os.environ["APK"], os.environ["APK2"]
          name = os.environ["TESTBED_NAME"]
          first_size, second_size = os.path.getsize(first), os.path.getsize(second)

          lines = [
              "## Android build (%s): the second APK is the INCREMENTAL one" % name,
              "",
              "This job ran the Android player build twice in one runner, over the same "
              "Unity project directory. The first build staged a fresh Gradle project; the "
              "second reused what the first left in `Library/`, which is the path CI had "
              "never exercised — every other leg starts from a clean checkout.",
              "",
              "| # | build | APK | bytes |",
              "|---|---|---|---|",
              "| 1 | clean | `%s` | %d |" % (os.path.basename(first), first_size),
              "| 2 | **incremental** | `%s` | %d |" % (os.path.basename(second), second_size),
              "",
              "Both APKs passed the same aapt2 assertions: the four built-in icon "
              "drawables, `res/xml/quickactions_shortcuts.xml`, `string/qa_short_0`, "
              "`res/raw/quickactions_keep.xml`, the `android.app.shortcuts` meta-data and "
              "the trampoline `<activity>` in the manifest, and both package classes in "
              "`classes.dex`. So the package's `IPostGenerateGradleAndroidProject` output "
              "survives a re-staged Gradle project, and is not something only a clean "
              "build produces.",
              "",
              "Artifacts: `quickactions-demo-apk-%s` (clean) and "
              "`quickactions-demo-apk-%s-incremental` (second)." % (name, name),
          ]
          report = "\n".join(lines)
          print(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(report + "\n")
          PY

  # The same adb smoke device-ci.yml runs on a user-supplied APK, but fed from
  # the build above: shortcuts must reach ShortcutManager and a tap must come
  # back as a Performed event. Asserts the placeholder feature's output ships
  # inside a real APK end-to-end.
  android-smoke:
    name: android smoke (${{ matrix.testbed.name }})
    needs: android-build
    # Not the implicit success() gate: that skips EVERY smoke leg when any one
    # build leg fails, losing the end-to-end signal for the healthy lines. Run
    # whenever the build job ran at all (a leg whose own APK is missing fails
    # fast at download-artifact); the no-secrets path still propagates as
    # skipped, keeping secretless runs green.
    if: ${{ !cancelled() && needs.android-build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Per-leg API level. The x86_64 emulator runs these ARM APKs under
        # binary translation, and the translation layer is part of the system
        # image: on the API 30 image the Unity 6 development player dies at
        # boot with a SIGSEGV in libunity.so profiling::Profiler::Initialize
        # (proven by the smoke's crash-buffer dump, 2026-08-21 run 10), while
        # 2021.3/2022.3 boot fine there. The unity6 leg therefore uses the
        # newest image and its far newer translator; the older lines stay on
        # API 30, where they are proven.
        testbed:
          - { name: "2021.3", api: 30 }
          - { name: "2022.3", api: 30 }
          - { name: "unity6", api: 35 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quickactions-demo-apk-${{ matrix.testbed.name }}
          path: ${{ runner.temp }}/apk
      # Same KVM prerequisite as device-ci.yml: without /dev/kvm the emulator
      # software-renders into the job timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device smoke (API ${{ matrix.testbed.api }} emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        # The wait budgets are raised well above the script's defaults because
        # this emulator runs the APK's ARM code under translation on a
        # software-rendered GPU: the first live run (2026-08-21, run 7) saw the
        # unity6 leg reach the foreground and then time out at the default 45s
        # with zero ShortcutManager calls, while 2021/2022 passed. A raised
        # budget only stretches the FAILURE case — the poll returns the moment
        # the condition holds — so a healthy leg pays nothing for it.
        env:
          SHORTCUT_ATTEMPTS: "240"
          COLD_LOG_ATTEMPTS: "180"
          # The smoke's opt-in tail (see capture_longpress in the script): once
          # the verdict is printed, drive the launcher — home, app drawer,
          # long-press the icon — and keep a screenshot plus the two UI dumps.
          # `dumpsys shortcut` above proves the icons resolved to a RESOURCE;
          # nobody has ever seen the built-in art drawn by a launcher, and this
          # is the cheapest place to look.
          #
          # It lives INSIDE this step because the emulator only exists for the
          # duration of this action: a later step has no device to talk to.
          # It cannot turn the step red — the script prints PASS first, runs
          # the capture in a subshell with errexit off, bounds every adb call
          # with `timeout`, and returns 0 whatever the launcher did.
          CAPTURE_LONGPRESS: "1"
          CAPTURE_DIR: ${{ runner.temp }}/longpress
        with:
          api-level: ${{ matrix.testbed.api }}
          arch: x86_64
          target: google_apis
          script: tools~/device-smoke/android_device_smoke.sh "$RUNNER_TEMP/apk/QuickActionsDemo-phone.apk" com.quickactions.testbed
      # The point of the whole exercise: a picture of the long-press sheet, one
      # per leg. Best-effort in both directions — the drawer gesture and the
      # sheet are the LAUNCHER's, and which launcher a google_apis image ships
      # is not something anything here has checked (the capture logs the HOME
      # activity it resolved, so the first run answers that). A leg can come
      # back with nothing but a screenshot of the app drawer; upload it anyway.
      # The two hierarchy dumps next to it are how the next person fixes the
      # gesture, and the step log already said "shortcut sheet visible: yes/no".
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        # Belt and braces: the capture cannot fail the smoke step, and a failed
        # upload of a decoration must not fail the job either.
        continue-on-error: true
        with:
          name: longpress-${{ matrix.testbed.name }}
          path: ${{ runner.temp }}/longpress
          # On a RED smoke the script exits before the capture, so this
          # directory does not exist — and that must not annotate a run whose
          # log already says what actually failed.
          if-no-files-found: ignore
          retention-days: 14

  # ROADMAP verification item (c), automated: does AGP's resource shrinker
  # actually HONOUR the keep rule the package ships? 0.4.7 made every enabled
  # Android build write res/raw/quickactions_keep.xml
  # (tools:keep="@drawable/ic_quickaction_*") because the icon drawables are
  # reached only through getIdentifier("ic_quickaction_" + name, ...) — no
  # static reference for a shrinker to find. Eight headless tests pin that the
  # file is written and what it contains; NOTHING anywhere has ever run a
  # minified release build to see whether it works. This job is that build.
  #
  # Method: export the Gradle project (TestbedBuilder.ExportAndroidGradle),
  # plant two unreferenced 1x1 PNGs into the exported unityLibrary — one named
  # to match the keep glob, one named to match nothing — then flip
  # minifyEnabled + shrinkResources on POST-export and assemble release. The
  # control must be shrunk (else the shrinker never ran and the run proves
  # nothing) and the probe must come back byte-identical. Flipping those flags
  # inside the testbed instead would ship experiment-only build configuration
  # to every reader of the example.
  #
  # What a green run does NOT prove: that the KEEP RULE is what saved the
  # probe. AGP's default *safe* mode also carries a DEX string-prefix heuristic
  # that can retain "ic_quickaction_*" on its own (0.4.7's changelog says so).
  # Isolating the two would need tools:shrinkMode="strict", which the package
  # deliberately never sets. Green here means "the icons survive a minified
  # release build", which is the user-visible claim.
  #
  # One line only (2022.3 — the line whose Android bake was proven on a real
  # APK): it answers a question about AGP, not about a Unity version, so running
  # it per line would buy nothing. It builds the resource shrinker's own Gradle
  # task rather than a whole APK — assembleRelease drags in the release IL2CPP
  # native build, which overran a two-hour ceiling twice (runs 30 and 31) and
  # produces nothing this experiment reads. Every step fails LOUDLY and prints what it could not parse
  # instead of skipping. The job's first run (2026-08-21) validated its own
  # design the hard way, exactly where the header had warned: export, chown,
  # probe-planting and the minify flip all worked, and the build then died
  # because the export ships NO gradlew and the runner's system Gradle (9.x)
  # cannot load the AGP 7.1.2 the export pins (org.gradle.util.GUtil is gone
  # in Gradle 9). The job now supplies JDK 17 and NDK r23b, downloads the
  # Gradle the export's own wrapper properties name (checksum-verified against
  # Gradle's published one) and re-points the docker-image paths the export
  # hardcodes, instead of trusting the runner image's drift — the "JDK 11,
  # Gradle 7.2" an earlier version of this comment promised was a guess about
  # Unity 2022.3's bundle that run 25 disproved (see the JDK step below).
  android-shrink-verify:
    name: android shrink verify (2022.3)
    needs: [license, tests-unity6-latest]
    if: ${{ !cancelled() && needs.license.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    # 45: with a warm Library cache the whole job takes about four minutes (run
    # 35) and the Gradle step carries its own 30-minute ceiling below. The 120
    # it used to have was sized for assembleRelease, which it no longer runs.
    timeout-minutes: 45
    env:
      TESTBED: Examples~/Testbed2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same import as android-build: the build scene lives under
      # Assets/Samples/QuickActionsDemo/, and the copy dirties the checkout.
      - name: Import the Demo sample into the testbed
        run: |
          mkdir -p "$TESTBED/Assets/Samples/QuickActionsDemo"
          cp -R Samples~/Demo/. "$TESTBED/Assets/Samples/QuickActionsDemo/"
      # Unity 6000.6's editor asks for 1 GB of /dev/shm at start-up (its asset
      # database's UDS client: "Requested 1073741824 bytes, but only 67108864
      # available … run the container with --shm-size=1025M") and aborts without
      # it; Docker's default is 64 MB and GameCI's actions pass no --shm-size, so
      # the daemon's default is raised instead. Merged into the runner's existing
      # daemon.json rather than overwriting it (the image ships cgroup settings
      # there). Same step in every job that runs an editor in a container — the
      # unity6-latest canary was the first to hit it (run 37, 2026-09-01), and
      # the pinned legs will the day a testbed moves to 6.6+.
      - name: Give Unity's container the shared memory 6000.6+ needs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          path = "/etc/docker/daemon.json"
          cfg = json.load(open(path)) if os.path.exists(path) else {}
          cfg["default-shm-size"] = "2g"
          with open("daemon.json.new", "w") as f:
              json.dump(cfg, f, indent=2)
          print(json.dumps(cfg, indent=2))
          PY
          sudo mv daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.Name}}: docker restarted, default shm raised' \
            || { echo "docker did not come back after the restart"; exit 1; }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Examples~/Testbed2022/Library
          key: Library-2022.3-export-${{ hashFiles('Examples~/Testbed2022/Packages/**', 'Examples~/Testbed2022/ProjectSettings/**') }}
          restore-keys: |
            Library-2022.3-export-
            Library-2022.3-
      # JDK 17: run 25 showed this export is not the AGP 7.1.2 combo an earlier
      # comment here assumed — it compiles against SDK 36 and AGP rejected
      # Gradle 7.2 outright ("Minimum supported Gradle version is 7.5"). Modern
      # AGP runs on 17, and 17 is also what sdkmanager itself is compiled for,
      # so the NDK install below no longer needs its own JAVA_HOME override.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: Examples~/Testbed2022
          targetPlatform: Android
          buildMethod: TestbedBuilder.ExportAndroidGradle
          versioning: None
          allowDirtyBuild: true
      # unity-builder runs Unity as root inside its docker image (runAsHostUser
      # defaults to false, in v5.0.0 as in v4) and only `chmod -R a+r`s the
      # result, so the whole export comes back root-owned and read-only to this
      # runner (uid 1001). android-build never notices — its post-build steps
      # only READ the APK — but every step below WRITES into the export tree:
      # the probe PNGs, the build.gradle rewrite, the .pro file,
      # local.properties, gradlew's mode bit, and Gradle's own build/ dirs.
      # Without this, the first write dies with EACCES as a bare traceback.
      - name: Take ownership of the exported project
        run: sudo chown -R "$(id -u):$(id -g)" "$TESTBED/Builds"
      - name: Plant probe drawables in the exported project
        run: |
          set -euo pipefail
          # Where Unity puts an exported Gradle project has changed between
          # versions (a <productName> subfolder appears in some), so find the
          # launcher module rather than assuming a path — and dump the tree if
          # it is not there, because a wrong guess must not read as "no probes".
          BUILDS="$TESTBED/Builds"
          LAUNCHER_GRADLE="$(find "$BUILDS" -type f -path '*/launcher/build.gradle' -print -quit 2>/dev/null || true)"
          if [ -z "$LAUNCHER_GRADLE" ]; then
            echo "no launcher/build.gradle under $BUILDS — the Gradle export did not land where this job expects it."
            find "$BUILDS" -maxdepth 4 -print 2>/dev/null || echo "($BUILDS does not exist at all)"
            exit 1
          fi
          EXPORT="$(dirname "$(dirname "$LAUNCHER_GRADLE")")"
          echo "exported project: $EXPORT"
          if [ ! -d "$EXPORT/unityLibrary/src/main" ]; then
            echo "no unityLibrary/src/main under $EXPORT — the export has a shape this job cannot use."
            find "$EXPORT" -maxdepth 3 -print
            exit 1
          fi
          {
            echo "EXPORT=$EXPORT"
            echo "LAUNCHER_GRADLE=$LAUNCHER_GRADLE"
          } >> "$GITHUB_ENV"
          export RES_DIR="$EXPORT/unityLibrary/src/main/res/drawable"
          export SIZES_FILE="$RUNNER_TEMP/planted-sizes.txt"
          echo "SIZES_FILE=$SIZES_FILE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          import pathlib
          import struct
          import zlib

          # Two 1x1 PNGs that NOTHING references, planted into the exported Unity library
          # module so the release build has to decide their fate on its own:
          #   ic_quickaction_probe  matches the package's shipped keep glob
          #                         (tools:keep="@drawable/ic_quickaction_*") and must
          #                         come out of the shrinker byte-for-byte intact;
          #   zz_shrink_control     matches nothing — no keep rule, and deliberately no
          #                         qa_/ic_ prefix, so AGP's safe-mode DEX string-prefix
          #                         heuristic cannot retain it either. It is the control:
          #                         if IT survives unchanged the shrinker never ran and
          #                         the probe proves nothing.
          # Each is padded past 800 bytes with a tEXt chunk, because the shrinker's
          # "dummy replacement" is a 67-byte 1x1 PNG — at this size a replaced file is
          # unmistakable, and a size comparison needs no heuristics.
          PROBES = ["ic_quickaction_probe", "zz_shrink_control"]
          PAD_TARGET = 900


          def chunk(tag, data):
              return (struct.pack(">I", len(data)) + tag + data
                      + struct.pack(">I", zlib.crc32(tag + data) & 0xFFFFFFFF))


          def png_1x1(label):
              # 1x1, 8-bit RGBA, no interlace; one filter byte + one opaque red pixel.
              ihdr = struct.pack(">IIBBBBB", 1, 1, 8, 6, 0, 0, 0)
              idat = zlib.compress(b"\x00\xff\x00\x00\xff", 9)
              filler = ("quickactions-shrink-probe:" + label + ";") * 40
              text = b"Comment\x00" + filler.encode("ascii")[:PAD_TARGET]
              return (b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"tEXt", text)
                      + chunk(b"IDAT", idat) + chunk(b"IEND", b""))


          res_dir = pathlib.Path(os.environ["RES_DIR"])
          res_dir.mkdir(parents=True, exist_ok=True)
          lines = []
          for name in PROBES:
              target = res_dir / (name + ".png")
              target.write_bytes(png_1x1(name))
              size = target.stat().st_size
              if size < 800:
                  raise SystemExit("planted %s is only %d bytes — too close to the "
                                   "shrinker's 67-byte dummy to tell them apart" % (name, size))
              lines.append("%s %d" % (name, size))
              print("planted %s (%d bytes)" % (target, size))

          # 0.5.0: the built-in icons the package's post-processor wrote into this
          # export (drawable/ic_quickaction_builtin_<name>.xml). Recorded by NAME so
          # the assertion holds the SHIPPED art to the same bar as the probe — real
          # resources that only the runtime lookup references, i.e. exactly what the
          # keep rule exists for. The source size below is informational: aapt2
          # compiles XML, so the assertion compares the linked archive against the
          # stripped one instead of against the file on disk. Their absence is a
          # finding, not a skip: this export was produced with QUICKACTIONS_ENABLED,
          # so the writer must have run.
          shipped = sorted(res_dir.parent.glob("drawable*/ic_quickaction_builtin_*.xml"))
          if not shipped:
              raise SystemExit("no built-in ic_quickaction_builtin_*.xml under %s/drawable*/ — the "
                               "package's post-processor did not write the 0.5.0 icons into "
                               "this export" % res_dir.parent)
          # The -v26 <adaptive-icon> variant: a second FILE under a resource name the
          # plain vector already covers, so nothing else in this job would notice it
          # missing — hence its own check here.
          if not any(icon.parent.name.endswith("-v26") for icon in shipped):
              raise SystemExit("no built-in icon under a drawable*-v26 bucket of %s — the "
                               "post-processor wrote the API 25 vectors but not the adaptive "
                               "variant. Buckets found: %s"
                               % (res_dir.parent, sorted({i.parent.name for i in shipped})))
          seen = set()
          for icon in shipped:
              size = icon.stat().st_size
              print("shipped %s (%d bytes)" % (icon, size))
              # ONE row per resource NAME. An icon now has two config-qualified files
              # under one name (drawable/ and drawable-anydpi-v26/), and the assertion
              # this feeds compares a resource between two archives — a second row for
              # the same name would just overwrite the first with a size that is
              # informational anyway.
              if icon.stem not in seen:
                  seen.add(icon.stem)
                  lines.append("%s %d" % (icon.stem, size))

          pathlib.Path(os.environ["SIZES_FILE"]).write_text("\n".join(lines) + "\n")
          PY
      - name: Force minify + resource shrinking on the exported release build
        run: |
          set -euo pipefail
          export GRADLE_FILE="$LAUNCHER_GRADLE"
          export PRO_NAME="quickactions-keep-all.pro"
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          # Turn the EXPORTED launcher module into a minified, resource-shrinking release
          # build. This is the whole point of exporting instead of building an APK: the
          # testbeds stay ordinary examples, and the experiment's build configuration
          # lives here, in CI, for one run.
          #
          # Three edits inside the release buildType:
          #   minifyEnabled true    — AGP refuses to run the RESOURCE shrinker without
          #                           code shrinking; it is a prerequisite, not the subject.
          #   shrinkResources true  — the subject: does it honour our res/raw keep file?
          #   crunchPngs false      — release builds re-encode PNGs by default, which
          #                           would change the planted probes' bytes for a reason
          #                           that has nothing to do with shrinking and make the
          #                           size comparison meaningless.
          # Plus a keep-everything ProGuard file: the code shrinker only has to SUCCEED,
          # and keeping every class also keeps the DEX string constants, so the run
          # matches a realistic app in AGP's default safe mode rather than an artificially
          # stripped one.
          GRADLE = pathlib.Path(os.environ["GRADLE_FILE"])
          PRO_NAME = os.environ.get("PRO_NAME", "quickactions-keep-all.pro")

          PRO_TEXT = """# Written by .github/workflows/unity-ci.yml (job android-shrink-verify).
          # Keep-everything on purpose: this experiment is about the RESOURCE shrinker,
          # which requires minifyEnabled but not aggressive code stripping. Keeping the
          # classes also keeps their string constants in the DEX, which is what AGP's
          # safe-mode resource heuristics read.
          -dontoptimize
          -dontobfuscate
          -dontwarn **
          -keep class ** { *; }
          """


          def die(message):
              # Loud, with the file that could not be parsed: the first real run of this
              # job IS its validation, so a surprise must arrive as evidence, never as a
              # silent skip or a clever guess.
              sys.stderr.write("FAIL: %s\n" % message)
              sys.stderr.write("----- %s -----\n%s\n----- end -----\n"
                               % (GRADLE, GRADLE.read_text()))
              raise SystemExit(1)


          def block_span(text, header, start=0):
              """Span of a `header {` ... `}` block: (open-brace index, close index)."""
              m = re.compile(header).search(text, start)
              if not m:
                  return None
              open_idx = text.index("{", m.end() - 1)
              depth = 0
              for i in range(open_idx, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return open_idx, i
              return None


          text = GRADLE.read_text()

          build_types = block_span(text, r"\bbuildTypes\s*\{")
          if not build_types:
              die("no `buildTypes {` block in the exported launcher build.gradle")
          release = block_span(text, r"\brelease\s*\{", build_types[0])
          if not release or release[1] > build_types[1]:
              die("no `release {` block inside `buildTypes` of the exported launcher build.gradle")

          lines = text[release[0] + 1:release[1]].split("\n")
          indent = "        "
          for line in lines:
              if line.strip():
                  indent = line[:len(line) - len(line.lstrip())]
                  break
          # lines[0] is whatever trailed `release {` on its own line (normally nothing),
          # so new statements go after it.
          insert_at = 1 if not lines[0].strip() else 0


          def set_flag(name, value):
              global insert_at
              pattern = re.compile(r"^(\s*)" + name + r"\b.*$")
              for i, line in enumerate(lines):
                  m = pattern.match(line)
                  if m:
                      lines[i] = m.group(1) + "%s %s" % (name, value)
                      print("replaced: %s -> %s %s" % (line.strip(), name, value))
                      return
              lines.insert(insert_at, indent + "%s %s" % (name, value))
              insert_at += 1
              print("inserted: %s %s" % (name, value))


          set_flag("minifyEnabled", "true")
          set_flag("shrinkResources", "true")
          set_flag("crunchPngs", "false")

          # The keep-everything file goes in as its OWN statement, last in the release
          # block. AGP's proguardFiles(...) APPENDS to the list, so this composes with
          # whatever the export already declares instead of rewriting it.
          #
          # Rewriting it is what failed in run 28. Unity's launcher template ends the
          # line in `proguardFiles getDefaultProguardFile('proguard-android.txt')`, and
          # extending "inside the trailing parenthesis" put the second file inside
          # getDefaultProguardFile(), which takes exactly one argument — the build died
          # at configuration time, before the shrinker it exists to test ever ran.
          # Going LAST also survives an export that assigns (`proguardFiles = [...]`)
          # rather than adds: an insert above such a line would be silently dropped.
          tail = len(lines)
          while tail > 0 and not lines[tail - 1].strip():
              tail -= 1
          lines.insert(tail, indent + "proguardFiles '%s'" % PRO_NAME)
          print("added proguardFiles '%s' as the release block's last statement" % PRO_NAME)

          body = "\n".join(lines)
          GRADLE.write_text(text[:release[0] + 1] + body + text[release[1]:])
          (GRADLE.parent / PRO_NAME).write_text(PRO_TEXT)

          print("----- release block after the edit -----")
          print("release {" + body + "}")
          print("----- end -----")
          PY
      # The toolchain the export actually expects, supplied rather than hoped
      # for. Gradle 7.2 is the version Unity 2022.3 bundles (the export ships
      # no wrapper to say so itself); sha256 is the published value from
      # services.gradle.org/distributions/gradle-7.2-bin.zip.sha256. NDK r23b
      # (23.1.7779620) is what Unity 2022.3 compiles IL2CPP with, and the
      # export's BuildIl2CppTask needs a real NDK at gradle time.
      - name: Pin the toolchain the export expects (Gradle from the export, NDK r23b)
        run: |
          set -euo pipefail
          # ASK the export which Gradle it needs; do not guess. Run 25 died on
          # "Minimum supported Gradle version is 7.5. Current version is 7.2"
          # because 7.2 came from an assumption about Unity 2022.3's AGP that
          # this export does not match — it compiles against SDK 36. Unity
          # writes the version it tested into the wrapper properties, so that
          # file is the authority; the AGP coordinate is the fallback, and a
          # modern default is the last resort. Whatever is chosen is printed,
          # so a wrong pick is diagnosable from the log alone.
          GRADLE_VERSION=""
          WRAPPER="$EXPORT/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            echo "--- $WRAPPER ---"
            cat "$WRAPPER"
            # -E, not BRE (`\|` alternation inside `\(...\)` does not match on
            # this sed), and `#` as the delimiter, not `|` — the alternation
            # below contains a `|`, which would close an `s|...|` early.
            GRADLE_VERSION="$(sed -nE 's#.*gradle-([0-9][0-9.]*)-(all|bin)\.zip.*#\1#p' "$WRAPPER" | head -1)"
            # A plain `[ -n x ] && echo` would END this step under `set -e` when
            # the capture is empty — silently, with no Gradle downloaded.
            if [ -n "$GRADLE_VERSION" ]; then
              echo "the export's wrapper asks for Gradle $GRADLE_VERSION"
            else
              echo "could not parse a version out of the wrapper properties"
            fi
          else
            echo "no gradle-wrapper.properties in the export"
          fi
          if [ -z "$GRADLE_VERSION" ]; then
            # `|| true`: a grep with no match exits 1, and under `pipefail` that
            # would end the step instead of falling through to the default —
            # i.e. the one path that exists for "the export gave no hint".
            AGP="$(grep -rhoE 'com\.android\.tools\.build:gradle:[0-9][0-9.]*' "$EXPORT" \
                     --include='*.gradle' 2>/dev/null | head -1 | awk -F: '{print $3}' || true)"
            echo "AGP coordinate found in the export: ${AGP:-<none>}"
            case "${AGP%%.*}" in
              8|9) GRADLE_VERSION=8.7 ;;
              7)   GRADLE_VERSION=7.5 ;;
              *)   GRADLE_VERSION=8.7 ;;   # unknown/newer: modern default
            esac
            echo "no wrapper version; deriving Gradle $GRADLE_VERSION from AGP"
          fi
          ZIP="gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSL -o "$RUNNER_TEMP/$ZIP" "https://services.gradle.org/distributions/$ZIP"
          # The version is discovered, so its checksum cannot be pinned in this
          # file. Verify against Gradle's published one: that catches a corrupt
          # or truncated download, and is the strongest check available without
          # hardcoding a version this job deliberately does not control.
          curl -fsSL -o "$RUNNER_TEMP/$ZIP.sha256" "https://services.gradle.org/distributions/$ZIP.sha256"
          echo "$(cat "$RUNNER_TEMP/$ZIP.sha256")  $RUNNER_TEMP/$ZIP" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$ZIP" -d "$RUNNER_TEMP/gradle-dist"
          echo "PINNED_GRADLE=$RUNNER_TEMP/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          # Full path, not bare `sdkmanager`: the runner image does not put it
          # on PATH for plain run steps (run 13 died here with exit 127 — only
          # the emulator action's internal calls have it resolved).
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          fi
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "no executable sdkmanager under $SDK/cmdline-tools — cannot install NDK r23b."
            ls -la "$SDK" || true
            exit 1
          fi
          "$SDKM" --install 'ndk;23.1.7779620' > /dev/null
          echo "NDK_FOR_EXPORT=$SDK/ndk/23.1.7779620" >> "$GITHUB_ENV"
      # The export hardcodes paths from inside the builder's docker image: an
      # android.aapt2FromMavenOverride into /opt/unity and an ndkPath for the
      # IL2CPP build. Both are re-pointed at this runner's copies, loudly.
      #
      # The override must be RE-POINTED, not merely dropped. Dropping it makes
      # AGP resolve its own aapt2 from Maven, and that AGP 7-era binary cannot
      # read the SDK 36 android.jar this export compiles against — run 32 died
      # in 34 seconds with "RES_TABLE_TYPE_TYPE entry offsets overlap actual
      # entry data" / "failed to load include path .../android-36/android.jar".
      # Unity does not hit it inside its container because the override it
      # writes points at an aapt2 new enough; the runner's newest build-tools
      # copy is the equivalent, and is the same binary the android-build job's
      # assertion already reads SDK-36 APKs with.
      - name: Point the export at this runner's toolchain
        run: |
          set -euo pipefail
          cd "$EXPORT"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2_FOR_EXPORT="$(find "$SDK/build-tools" -maxdepth 2 -name aapt2 -type f 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$AAPT2_FOR_EXPORT" ]; then
            echo "no aapt2 under '${SDK:-<ANDROID_HOME and ANDROID_SDK_ROOT both unset>}'/build-tools/*/ —"
            echo "AGP would fall back to its own Maven copy, which cannot read this export's compileSdk."
            exit 1
          fi
          export AAPT2_FOR_EXPORT
          python3 - <<'PY'
          import os
          import pathlib
          import re

          gp = pathlib.Path("gradle.properties")
          kept = []
          if gp.exists():
              for line in gp.read_text().splitlines():
                  if "/opt/unity" in line:
                      print("stripped from gradle.properties:", line)
                  else:
                      kept.append(line)
          # Re-point rather than leave unset — see the note above this step.
          # Written unconditionally, including when the export shipped no
          # gradle.properties at all, so the aapt2 AGP uses is never whichever
          # one Maven happens to hand it.
          aapt2 = os.environ["AAPT2_FOR_EXPORT"]
          kept = [l for l in kept if not l.startswith("android.aapt2FromMavenOverride")]
          kept.append("android.aapt2FromMavenOverride=" + aapt2)
          gp.write_text("\n".join(kept) + "\n")
          print("aapt2FromMavenOverride ->", aapt2)

          ndk = os.environ["NDK_FOR_EXPORT"]
          repointed = []
          for name in ("launcher/build.gradle", "unityLibrary/build.gradle"):
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              text = p.read_text()
              new = re.sub(r'ndkPath\s+"[^"]*"', 'ndkPath "%s"' % ndk, text)
              if new != text:
                  print("re-pointed ndkPath in", name)
                  p.write_text(new)
                  repointed.append(name)
          # A silent no-op here would surface much later as an opaque "NDK not
          # configured" inside BuildIl2CppTask, so say it now. Not fatal: Unity also
          # writes ndkVersion, which resolves to the same $SDK/ndk/<version> this
          # job installed — but the log must show which of the two AGP will use.
          if not repointed:
              print("WARNING: no ndkPath found in either module — relying on ndkVersion.")
          for name in ("launcher/build.gradle", "unityLibrary/build.gradle"):
              p = pathlib.Path(name)
              if p.exists():
                  for line in p.read_text().splitlines():
                      if "ndkPath" in line or "ndkVersion" in line:
                          print("%s: %s" % (name, line.strip()))
          PY
          # Diagnostics only, never fatal: the export was produced inside the
          # builder's container, so any file still naming a container path
          # (/opt/unity, /github/workspace) is a candidate cause for a Gradle
          # failure later in this job. Surveying them here means the log already
          # holds the answer instead of costing another heavy run to find. The
          # `|| true` keeps a no-match grep (exit 1) from ending the step.
          echo "--- container paths still present in the export ---"
          grep -rn -e /opt/unity -e /github/workspace . \
            --include='*.gradle' --include='*.properties' \
            --include='*.cmake' --include='*.mk' 2>/dev/null | head -40 || true
          echo "--- end survey ---"
      - name: Gradle release build of the exported project
        # The job's 120-minute ceiling is not a useful signal: it reports
        # "cancelled" with no failing step. A tighter step ceiling turns a
        # runaway build into a named failure with the log attached.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cd "$EXPORT"
          # Unity writes local.properties from inside the unity-builder docker
          # image, so sdk.dir (and any ndk.dir) point at paths that do not
          # exist on this runner. Strip both and re-add ONLY sdk.dir: the NDK is
          # already expressed as ndkPath in build.gradle (re-pointed by the step
          # above), and AGP 7 treats "both android.ndkPath and ndk.dir are set"
          # as CXX1100 — it stops resolving the NDK entirely, which surfaces as
          # a confusing "NDK is not installed" once BuildIl2CppTask runs. Even
          # identical paths trip it; the check is presence, not value.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "neither ANDROID_HOME nor ANDROID_SDK_ROOT is set — no Android SDK to build against."
            exit 1
          fi
          if [ -f local.properties ]; then
            grep -vE '^(sdk|ndk)\.dir=' local.properties > "$RUNNER_TEMP/local.properties" || true
          else
            : > "$RUNNER_TEMP/local.properties"
          fi
          printf 'sdk.dir=%s\n' "$SDK" >> "$RUNNER_TEMP/local.properties"
          cp "$RUNNER_TEMP/local.properties" local.properties
          echo "--- local.properties ---"
          cat local.properties
          # Prefer a wrapper if the export ever ships one; otherwise use the
          # pinned Gradle 7.2 — NEVER the runner's system gradle, whose major
          # version drifts (9.x today, which cannot load AGP 7.1.2; the first
          # run died exactly there).
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE_CMD=./gradlew
          elif [ -n "${PINNED_GRADLE:-}" ] && [ -x "$PINNED_GRADLE" ]; then
            GRADLE_CMD="$PINNED_GRADLE"
          else
            echo "the export ships no gradlew and the pinned Gradle is missing — did the pin step run?"
            ls -la
            exit 1
          fi
          echo "building with $GRADLE_CMD"
          # NOT assembleRelease. Two runs (30 and 31) proved that path unusable:
          # the Gradle step hit the job's 120-minute ceiling both times, still
          # running il2cpp/bee_backend when the runner killed it (the orphan
          # processes are named in run 30's log tail). assembleRelease has to
          # PACKAGE the app, so it pulls in the IL2CPP native build — in the
          # release variant, fully optimised — which the android-build job never
          # pays because its APK is a development build.
          #
          # The experiment does not need an APK. shrinkReleaseRes IS the resource
          # shrinker: it consumes the linked resources plus R8's output to decide
          # what is reachable, and writes a stripped resource archive. Its inputs
          # are Java and resources; the native build is a sibling that only
          # packaging joins. Skipping it removes hours and removes nothing the
          # probe/control comparison reads.
          # precompileDependenciesResources=false routes unityLibrary's resources
          # through the launcher's own mergeReleaseResources — where the
          # `crunchPngs false` this job sets actually applies. Without it the
          # library module compiles the planted probe PNGs under AGP's release
          # default, re-encoding them, and the byte-exact probe comparison would
          # report "inconclusive" for a reason that has nothing to do with the
          # shrinker. shrinkResources still runs on the linked app resources, so
          # the experiment is unchanged.
          if ! "$GRADLE_CMD" --no-daemon --console=plain --stacktrace \
                 -Pandroid.precompileDependenciesResources=false \
                 :launcher:shrinkReleaseRes; then
            # Most likely cause of a hard failure here is the task name moving
            # between AGP versions, so name the ones this export actually has
            # rather than leaving the next reader to guess.
            echo "::group::shrink-related tasks this export declares"
            "$GRADLE_CMD" --no-daemon --console=plain -q :launcher:tasks --all 2>/dev/null \
              | grep -i shrink || echo "(no task with 'shrink' in its name)"
            echo "::endgroup::"
            exit 1
          fi
      - name: Assert the shrinker ran AND the keep rule held
        run: |
          set -euo pipefail
          # shrinkReleaseRes writes a stripped resource archive under
          # build/intermediates. The leaf directory has moved between AGP
          # versions, so find it by shape rather than hardcoding a path that
          # would silently start matching nothing.
          INT="$EXPORT/launcher/build/intermediates"
          APK="$(find "$INT" -type f -name '*.ap_' \
                   \( -path '*shrunk*' -o -path '*stripped*' -o -name '*stripped*' \) \
                   2>/dev/null | sort | tail -1 || true)"
          if [ -z "$APK" ]; then
            echo "no stripped resource archive under $INT — shrinkReleaseRes reported"
            echo "success but produced nothing this step recognises."
            find "$INT" -name '*.ap_' -print 2>/dev/null || echo "(no .ap_ anywhere)"
            exit 1
          fi
          # An .ap_ is a zip with res/ and resources.arsc, which is exactly what
          # both readers below want; it simply has no dex or native libs in it.
          echo "shrunk resource archive: $APK ($(wc -c < "$APK") bytes)"
          # The LINKED archive the shrinker read — same layout, pre-shrink. The
          # shipped icons are compiled XML, so "unchanged" for them can only mean
          # "the same size in here as in the stripped one"; the planted PNGs are
          # stored verbatim and keep using their on-disk size.
          LINKED="$(find "$INT" -type f -name '*.ap_' \
                      ! -path '*shrunk*' ! -path '*stripped*' ! -name '*stripped*' \
                      2>/dev/null | sort | tail -1 || true)"
          if [ -z "$LINKED" ]; then
            echo "no pre-shrink resource archive under $INT — cannot tell what the"
            echo "shrinker was handed, so the shipped-icon rows below cannot be judged."
            find "$INT" -name '*.ap_' -print 2>/dev/null || echo "(no .ap_ anywhere)"
            exit 1
          fi
          echo "linked resource archive: $LINKED ($(wc -c < "$LINKED") bytes)"
          # Same aapt2 resolution as the android-build job's assertion step.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(find "$SDK/build-tools" -maxdepth 2 -name aapt2 -type f 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$AAPT2" ]; then
            echo "no aapt2 under '${SDK:-<unset>}'/build-tools/*/ — cannot read the resource table."
            exit 1
          fi
          export ZIP_LIST="$RUNNER_TEMP/apk-listing.txt"
          export RES_DUMP="$RUNNER_TEMP/apk-resources.txt"
          export TABLE_FILE="$RUNNER_TEMP/shrink-sizes.txt"
          unzip -l "$APK" > "$ZIP_LIST" \
            || { echo "unzip could not list $APK"; exit 1; }
          export LINKED_LIST="$RUNNER_TEMP/linked-listing.txt"
          unzip -l "$LINKED" > "$LINKED_LIST" \
            || { echo "unzip could not list $LINKED"; exit 1; }
          "$AAPT2" dump resources "$APK" > "$RES_DUMP" \
            || { echo "aapt2 could not read the resource table of $APK"; exit 1; }
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          import posixpath
          import re
          import sys

          # Read the release APK two ways and cross them:
          #   `unzip -l`             — the STORED size of every file in the APK;
          #   `aapt2 dump resources` — the resource table, which maps a resource NAME to
          #                            the file it ended up in. Needed because AGP's
          #                            release pipeline shortens resource paths
          #                            (res/drawable/ic_quickaction_probe.png -> res/AB.png),
          #                            so matching zip entries by name alone would report
          #                            a kept file as missing.
          # Then two verdicts, from the planted sizes recorded before the build:
          #   control (zz_shrink_control) must have SHRUNK or vanished — otherwise the
          #     resource shrinker never ran and the whole run proves nothing;
          #   probe (ic_quickaction_probe) must be byte-for-byte its planted size —
          #     that is the package's keep rule doing its job.
          CONTROL = "zz_shrink_control"
          PROBE = "ic_quickaction_probe"
          KEEP_RESOURCE = "raw/quickactions_keep"
          KEEP_PATH = "res/raw/quickactions_keep.xml"
          # AGP replaces a shrunk file resource with a ~67-byte 1x1 dummy; anything near
          # that size is a replacement, not a re-encode.
          DUMMY_CEILING = 200

          zip_list = open(os.environ["ZIP_LIST"], encoding="utf-8", errors="replace").read()
          linked_list = open(os.environ["LINKED_LIST"], encoding="utf-8", errors="replace").read()
          res_dump = open(os.environ["RES_DUMP"], encoding="utf-8", errors="replace").read()

          planted = {}
          for line in open(os.environ["SIZES_FILE"], encoding="utf-8"):
              if line.split():
                  name, size = line.split()
                  planted[name] = int(size)

          # name -> uncompressed length, from the `unzip -l` table (header, separators and
          # the totals line all fail the pattern, which is the point of parsing this way).
          def sizes(listing):
              out = {}
              for line in listing.splitlines():
                  m = re.match(r"^\s*(\d+)\s+\S+\s+\S+\s+(\S.*?)\s*$", line)
                  if m:
                      out[m.group(2)] = int(m.group(1))
              return out


          entries = sizes(zip_list)
          linked = sizes(linked_list)

          # resource name -> the res/ path it is stored as.
          res_paths = {}
          current = None
          for line in res_dump.splitlines():
              m = re.match(r"\s*resource\s+0x[0-9a-fA-F]+\s+(\S+)", line)
              if m:
                  current = m.group(1)
                  continue
              if re.match(r"\s*(type|Package|Binary|Proto)\b", line):
                  current = None
                  continue
              if current:
                  m = re.search(r"(res/[^\s\"]+)", line)
                  if m and current not in res_paths:
                      res_paths[current] = m.group(1)


          def stored(name):
              """(path, size) of a planted drawable in the built APK, or (None, None)."""
              path = res_paths.get("drawable/" + name)
              if path and path in entries:
                  return path, entries[path]
              for entry, size in entries.items():
                  if posixpath.basename(entry).split(".")[0] == name:
                      return entry, size
              return path, None


          rows = []
          for name in (PROBE, CONTROL):
              path, size = stored(name)
              rows.append((name, planted.get(name), size, path))
          # 0.5.0: the shipped built-in icons the plant step recorded. Same bar as
          # the probe — present, and unchanged by the shrinker — but measured
          # against the LINKED archive, because they are XML that aapt2 compiled
          # (their on-disk size means nothing in here). Indexed after the two
          # experiment rows so the checks below can keep addressing those by position.
          SHIPPED = sorted(n for n in planted if n.startswith("ic_quickaction_builtin_"))
          for name in SHIPPED:
              path, size = stored(name)
              rows.append((name, linked.get(path) if path else None, size, path))

          table = ["", "resource                   before    in APK  stored as",
                   "-------------------------  -------  --------  ---------",
                   "(before = planted size for the two probes, linked-archive size for the shipped icons)"]
          for name, before, after, path in rows:
              table.append("%-25s  %7s  %8s  %s"
                           % (name, before if before is not None else "?",
                              after if after is not None else "GONE", path or "-"))
          table.append("")
          report = "\n".join(table)
          print(report)
          if os.environ.get("TABLE_FILE"):
              open(os.environ["TABLE_FILE"], "w", encoding="utf-8").write(report + "\n")

          failures = []

          # (a) did the shrinker run at all?
          control_before, control_after = planted.get(CONTROL), rows[1][2]
          if control_after is None:
              print("ok: the control resource was removed outright — the shrinker ran")
          elif control_before is not None and control_after < control_before:
              # A shrink and a global re-encode look identical from the control alone.
              # They differ in what happened to the PROBE: the shrinker dummy-replaces
              # only what it drops, so a keep-protected probe should come out at its
              # planted size. Both landing on the same smaller size means something
              # re-encoded every PNG, and reading that as "the shrinker ran" would let
              # the next assertion draw a conclusion from a corrupted experiment.
              probe_now = rows[0][2]
              if (probe_now is not None and probe_now == control_after
                      and planted.get(PROBE) not in (None, probe_now)):
                  failures.append(
                      "experiment inconclusive: '%s' and '%s' both came out at %d bytes, "
                      "neither at its planted size. That is a global re-encode (PNG "
                      "crunching or an aapt2 optimize pass), not a shrink plus a "
                      "dummy-replace, so neither the shrinker's activity nor the keep "
                      "rule can be read off this run."
                      % (CONTROL, PROBE, control_after))
              else:
                  print("ok: the control resource shrank %d -> %d bytes — the shrinker ran"
                        % (control_before, control_after))
          else:
              failures.append(
                  "experiment inconclusive: the shrinker did not run. The unreferenced "
                  "control '%s' came out of the release build at %s bytes, unchanged from "
                  "the %s it was planted at. Nothing about the keep rule can be concluded "
                  "from this run — check that `minifyEnabled true` and `shrinkResources "
                  "true` really landed in the release buildType (the previous step prints "
                  "the block it wrote)." % (CONTROL, control_after, control_before))

          # (b) did the package's keep rule protect the icon drawable?
          probe_before, probe_after, probe_path = planted.get(PROBE), rows[0][2], rows[0][3]
          if probe_after is None:
              failures.append(
                  "the keep rule did not protect '%s': it is not in the release APK at "
                  "all. res/raw/quickactions_keep.xml ships tools:keep=\"@drawable/"
                  "ic_quickaction_*\" precisely to prevent this, so either AGP never read "
                  "the keep file (does it require the name keep.xml?) or the file did not "
                  "reach the merged resources." % PROBE)
          elif probe_before is not None and probe_after == probe_before:
              print("ok: '%s' survived at its planted %d bytes — the keep rule held"
                    % (PROBE, probe_after))
          elif probe_after <= DUMMY_CEILING:
              failures.append(
                  "the keep rule did not protect '%s': %s bytes in the APK against %s "
                  "planted, i.e. dummy-replaced. This is exactly the failure mode 0.4.7's "
                  "res/raw/quickactions_keep.xml was written to prevent — the resource "
                  "entry survives so getIdentifier() still resolves, and the launcher "
                  "draws a blank icon." % (PROBE, probe_after, probe_before))
          else:
              failures.append(
                  "experiment inconclusive for '%s': %s bytes in the APK against %s "
                  "planted, which is far too large to be the shrinker's dummy. Something "
                  "else re-encoded the file — PNG crunching (`crunchPngs false` should "
                  "have stopped it) or an aapt2 optimize pass. The keep rule is neither "
                  "proven nor disproven." % (PROBE, probe_after, probe_before))

          # (c) is the keep file itself in the shipped APK?
          if KEEP_RESOURCE in res_paths or KEEP_PATH in entries:
              print("ok: %s is present (stored as %s)"
                    % (KEEP_PATH, res_paths.get(KEEP_RESOURCE, KEEP_PATH)))
          else:
              failures.append(
                  "%s is not in the release APK. Either the package's Android "
                  "post-processor did not write it into this export, or the shrinker "
                  "dropped it after reading it — if this is the ONLY failure here, the "
                  "keep mechanism still worked and only this assertion needs revisiting."
                  % KEEP_PATH)

          # (d) did the keep rule carry the SHIPPED icons through unchanged? This is
          # the probe's question asked of the real art users get: the same keep
          # glob, referenced by the runtime lookup only (the demo's one static
          # reference to ic_quickaction_builtin_add aside), and a blank launcher
          # tile if the answer is no. "Unchanged" is judged between the linked and
          # the stripped archive: the shrinker rewrites in place, so a kept entry
          # keeps its size and a dropped one becomes a tiny dummy.
          # Since 0.5.0's adaptive variant the list also carries the two LAYERS of
          # each icon (…_background, …_foreground). They match the same keep glob
          # AND are referenced by their -v26 parent, so either route should save
          # them — which is what makes a layer that came out dummy-replaced beside
          # a kept parent worth failing on: on API 26+ that is a blank or ringed
          # tile, and on nothing else at all.
          if not SHIPPED:
              failures.append(
                  "the plant step recorded no shipped ic_quickaction_builtin_* icons, so "
                  "this run says nothing about the art the package actually ships.")
          for name, before, after, path in rows[2:]:
              if after is None:
                  failures.append(
                      "the shipped icon '%s' is not in the release resources at all." % name)
              elif before is None:
                  failures.append(
                      "the shipped icon '%s' is stored as %s in the stripped archive but that "
                      "entry is not in the linked one, so the two cannot be compared."
                      % (name, path))
              elif after == before:
                  print("ok: shipped '%s' came through the shrinker at its linked %d bytes"
                        % (name, after))
              elif after < before:
                  failures.append(
                      "the shipped icon '%s' shrank from %s to %s bytes across the shrinker, "
                      "i.e. was dummy-replaced. The keep rule covers ic_quickaction_*, so "
                      "either this name escaped it or the rule did not reach the merged "
                      "resources." % (name, before, after))
              else:
                  failures.append(
                      "the shipped icon '%s' GREW from %s to %s bytes across the shrinker, "
                      "which no shrink-or-keep outcome explains; the archives being compared "
                      "are probably not the pair this job assumes." % (name, before, after))

          if failures:
              sys.stderr.write("\n")
              for f in failures:
                  sys.stderr.write("FAIL: %s\n\n" % f)
              raise SystemExit(1)
          print("PASS: the resource shrinker ran, and the package's keep rule held.")
          PY
      # Uploaded on failure too: the size table IS the finding when this job is
      # red, and the APK lets a human re-run aapt2 on the same bytes.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: shrink-verify-2022.3
          # Globs, not ${{ env.APK_PATH }}: that variable is only set by the assert
          # step, so on the failure paths that matter most (the Gradle build died,
          # the assert never ran) it expands to an empty line in this list and the
          # artifact carries nothing but the planted sizes. The build.gradle and the
          # keep file below are what a human needs to diagnose such a run without
          # re-dispatching the whole job.
          path: |
            ${{ env.TESTBED }}/Builds/AndroidProject/launcher/build/intermediates/**/*.ap_
            ${{ env.TESTBED }}/Builds/AndroidProject/launcher/build.gradle
            ${{ env.TESTBED }}/Builds/AndroidProject/local.properties
            ${{ env.TESTBED }}/Builds/AndroidProject/unityLibrary/src/main/res/raw/quickactions_keep.xml
            ${{ runner.temp }}/shrink-sizes.txt
            ${{ runner.temp }}/planted-sizes.txt
          if-no-files-found: warn
          retention-days: 14

  # The gate's promise, measured on every push: with QUICKACTIONS_ENABLED off the
  # package leaves NOTHING in the shipped app. Testbed2022 is built twice more
  # with the define flipped OFF — an IL2CPP Android APK in exactly android-build's
  # configuration, and an iOS Simulator Xcode export — and asserted NEGATIVELY:
  # no trampoline <activity> and no android.app.shortcuts in the manifest, no
  # quickactions_* / qa_* / ic_quickaction_builtin_* resources, no
  # trace of the package's assembly in the IL2CPP metadata; no QUICKACTIONS_ENABLED
  # macro in the .pbxproj, no marked UIApplicationShortcutItems. Each negative
  # has its positive control: the define-ON artifacts android-build and
  # ios-export produced from the same commit must carry every one of those, or
  # the check is declared blind rather than passed. The two APKs are then
  # diffed byte for byte — that difference IS the package's footprint, printed
  # per run and capped at 1 MiB so a regression (an asset that starts shipping,
  # a stripped-code path that stops) turns red.
  #
  # Two editor invocations on purpose: the package refuses to build when the
  # define changes inside one invocation (the editor assemblies would still be
  # compiled with it), so the flip is its own step and the builds recompile
  # from scratch. One line (2022.3): the gate is the same C#/asmdef/post-processor
  # machinery on every line, and the hand-run proofs of 2026-07-17 already
  # covered 2021.3 and 6.3 — this job turns "proven once" into "proven per push".
  gate-off:
    name: gate off (2022.3)
    needs: [license, android-shrink-verify]
    if: ${{ !cancelled() && needs.license.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TESTBED: Examples~/Testbed2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same import as android-build: the Demo's static shortcuts and its
      # runtime Add(...) calls are exactly what must NOT reach a define-off build.
      - name: Import the Demo sample into the testbed
        run: |
          mkdir -p "$TESTBED/Assets/Samples/QuickActionsDemo"
          cp -R Samples~/Demo/. "$TESTBED/Assets/Samples/QuickActionsDemo/"
      # Unity 6000.6's editor asks for 1 GB of /dev/shm at start-up (its asset
      # database's UDS client: "Requested 1073741824 bytes, but only 67108864
      # available … run the container with --shm-size=1025M") and aborts without
      # it; Docker's default is 64 MB and GameCI's actions pass no --shm-size, so
      # the daemon's default is raised instead. Merged into the runner's existing
      # daemon.json rather than overwriting it (the image ships cgroup settings
      # there). Same step in every job that runs an editor in a container — the
      # unity6-latest canary was the first to hit it (run 37, 2026-09-01), and
      # the pinned legs will the day a testbed moves to 6.6+.
      - name: Give Unity's container the shared memory 6000.6+ needs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          path = "/etc/docker/daemon.json"
          cfg = json.load(open(path)) if os.path.exists(path) else {}
          cfg["default-shm-size"] = "2g"
          with open("daemon.json.new", "w") as f:
              json.dump(cfg, f, indent=2)
          print(json.dumps(cfg, indent=2))
          PY
          sudo mv daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.Name}}: docker restarted, default shm raised' \
            || { echo "docker did not come back after the restart"; exit 1; }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Examples~/Testbed2022/Library
          key: Library-2022.3-gateoff-${{ hashFiles('Examples~/Testbed2022/Packages/**', 'Examples~/Testbed2022/ProjectSettings/**') }}
          restore-keys: |
            Library-2022.3-gateoff-
            Library-2022.3-android-
            Library-2022.3-
      # Invocation 1 of 3: flip the define off for Android AND iOS and save.
      # Nothing is built; the next invocations start a fresh editor whose
      # assemblies compile without it — the gated ones not at all.
      - name: Flip QUICKACTIONS_ENABLED off (own editor invocation)
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: Examples~/Testbed2022
          targetPlatform: Android
          buildMethod: TestbedBuilder.DisableDefine
          versioning: None
          allowDirtyBuild: true
      # Invocation 2 of 3: the define-off APK, IL2CPP + both ABIs like
      # android-build's, so the two differ in nothing but the define.
      - name: Build the define-off Android APK
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: Examples~/Testbed2022
          targetPlatform: Android
          buildMethod: TestbedBuilder.BuildAndroidPhoneNoDefine
          versioning: None
          allowDirtyBuild: true
      # Invocation 3 of 3: the define-off iOS Simulator export.
      - name: Export the define-off iOS project
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: Examples~/Testbed2022
          targetPlatform: iOS
          buildMethod: TestbedBuilder.BuildiOSSimulatorNoDefine
          versioning: None
          allowDirtyBuild: true
      # Uploaded before any assertion, so a red run keeps the bytes it judged.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: gate-off-2022.3
          path: |
            Examples~/Testbed2022/Builds/NoDefine-phone.apk
            Examples~/Testbed2022/Builds/iOSSimulatorNoDefine/Info.plist
            Examples~/Testbed2022/Builds/iOSSimulatorNoDefine/Unity-iPhone.xcodeproj/project.pbxproj
          if-no-files-found: error
          retention-days: 14
      # The positive controls: what the same commit produced with the define ON.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quickactions-demo-apk-2022.3
          path: define-on-android
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-simulator-xcodeproj-2022.3
          path: define-on-ios
      - name: Assert the define-off APK carries nothing of the package
        env:
          OFF_APK: Examples~/Testbed2022/Builds/NoDefine-phone.apk
          ON_APK: define-on-android/QuickActionsDemo-phone.apk
        run: |
          set -euo pipefail
          for f in "$OFF_APK" "$ON_APK"; do
            [ -f "$f" ] || { echo "missing $f"; ls -la "$(dirname "$f")" 2>/dev/null || true; exit 1; }
          done
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(find "$SDK/build-tools" -maxdepth 2 -name aapt2 -type f 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$AAPT2" ] || { echo "no aapt2 under '${SDK:-<unset>}'/build-tools/*/"; exit 1; }
          # One reader for both APKs: the ON one must trip every check (or the
          # check is blind), the OFF one none of them. Captured then `case`,
          # never `| grep -q` (SIGPIPE under pipefail).
          scan() {
            local apk="$1" hits=""
            local res manifest meta
            # Diagnostics go to stderr: stdout is the hit list the caller captures.
            res="$("$AAPT2" dump resources "$apk")" || { echo "aapt2 could not read $apk" >&2; exit 1; }
            # (quickactions_strings is a values file: aapt2 lists its ENTRIES —
            # qa_short_N / qa_long_N — never the file name, so it is not probed.)
            for name in quickactions_shortcuts quickactions_keep qa_short_ qa_long_ ic_quickaction_builtin_; do
              case "$res" in *"$name"*) hits="$hits res:$name" ;; esac
            done
            manifest="$("$AAPT2" dump xmltree --file AndroidManifest.xml "$apk" 2>&1)" || { echo "aapt2 could not dump the manifest of $apk" >&2; exit 1; }
            for name in QuickActionsTrampolineActivity android.app.shortcuts; do
              case "$manifest" in *"$name"*) hits="$hits manifest:$name" ;; esac
            done
            # IL2CPP keeps assembly and type names in global-metadata.dat; the
            # gated runtime assembly is not compiled at all with the define off.
            # Extract first and fail LOUDLY if the file is not there: an APK
            # without it is an APK this probe cannot see into, and "0 hits"
            # would read as a clean gate. Only grep's no-match is ignorable.
            # The pattern names what only the ASSEMBLY leaves behind — its image
            # name, its Internal namespace, and the "namespace|Type" strings of
            # its root namespace — not the bare namespace prefix: consumer code
            # may live under it (the Demo sample's EminDeniz99.QuickActions.
            # DemoSample does, and it compiles with the define off since run 52
            # caught exactly that as a false leak).
            local metadata
            metadata="$(mktemp)"
            unzip -p "$apk" assets/bin/Data/Managed/Metadata/global-metadata.dat >"$metadata" \
              || { echo "could not extract global-metadata.dat from $apk — no IL2CPP metadata, the probe cannot run" >&2; exit 1; }
            [ -s "$metadata" ] || { echo "global-metadata.dat came out empty from $apk" >&2; exit 1; }
            meta="$(strings -a "$metadata" | grep -cE 'EminDeniz99\.QuickActions(\.dll|\.Internal|\|)' || true)"
            rm -f "$metadata"
            [ "${meta:-0}" -gt 0 ] && hits="$hits metadata:EminDeniz99.QuickActions(x$meta)"
            printf '%s' "$hits"
          }
          # The two plugin .java classes are compiled into EVERY build (Unity cannot
          # gate a loose native source), so the dex is not part of the gate — but it
          # is counted, so the "dead classes remain" line in the docs is a number
          # from this run rather than a belief. Diagnostics to stderr, count to stdout.
          dex_refs() {
            local apk="$1" dex
            dex="$(unzip -p "$apk" 'classes*.dex' 2>/dev/null | strings -a || true)"
            [ -n "$dex" ] || { echo "no readable classes*.dex in $apk" >&2; exit 1; }
            printf '%s\n' "$dex" | grep -c 'com/emindeniz99/quickactions/' || true
          }
          on_hits="$(scan "$ON_APK")"
          off_hits="$(scan "$OFF_APK")"
          on_dex="$(dex_refs "$ON_APK")"
          off_dex="$(dex_refs "$OFF_APK")"
          echo "define ON  ($ON_APK):$on_hits"
          echo "define OFF ($OFF_APK):${off_hits:-<nothing of the package>}"
          echo "dex references to com/emindeniz99/quickactions/: define ON $on_dex, define OFF $off_dex (the two plugin classes ship either way — documented, counted, not gated)"
          [ "$on_dex" -gt 0 ] || { echo "CONTROL FAILED: the define-on dex carries no package class reference, so the dex count cannot be trusted."; exit 1; }
          # Control first: EVERY probe scan() knows must fire on the define-on APK,
          # or the check is blind to that probe and says so instead of passing.
          for want in res:quickactions_shortcuts res:quickactions_keep res:qa_short_ res:qa_long_ res:ic_quickaction_builtin_ \
                      manifest:QuickActionsTrampolineActivity manifest:android.app.shortcuts metadata:EminDeniz99.QuickActions; do
            case "$on_hits" in
              *"$want"*) ;;
              *) echo "CONTROL FAILED: the define-on APK does not show '$want', so this check cannot see it — nothing below can be trusted."; exit 1 ;;
            esac
          done
          echo "ok: every probe fires on the define-on APK (the check can see)"
          if [ -n "$off_hits" ]; then
            echo "GATE LEAK: the define-off APK still carries:$off_hits"
            echo "--- define-off manifest ---"
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$OFF_APK" 2>&1 | head -120
            echo "--- define-off resources mentioning quickactions/qa_ ---"
            "$AAPT2" dump resources "$OFF_APK" | grep -iE 'quickactions|qa_short|qa_long|ic_quickaction' || echo "(none)"
            echo "--- define-off IL2CPP metadata strings mentioning EminDeniz99.QuickActions (all of them, probe-matching or not) ---"
            unzip -p "$OFF_APK" assets/bin/Data/Managed/Metadata/global-metadata.dat | strings -a | grep 'EminDeniz99.QuickActions' || echo "(none)"
            exit 1
          fi
          echo "PASS: nothing of the package in the define-off APK (manifest, resources, IL2CPP metadata); the dex keeps the two plugin classes ($off_dex references), as documented"
      - name: Measure the package's footprint (define-on APK minus define-off APK)
        env:
          OFF_APK: Examples~/Testbed2022/Builds/NoDefine-phone.apk
          ON_APK: define-on-android/QuickActionsDemo-phone.apk
          CEILING_BYTES: "1048576"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import zipfile

          on, off = os.environ["ON_APK"], os.environ["OFF_APK"]
          ceiling = int(os.environ["CEILING_BYTES"])

          def entries(path):
              with zipfile.ZipFile(path) as z:
                  return {i.filename: i.file_size for i in z.infolist()}

          on_e, off_e = entries(on), entries(off)
          on_size, off_size = os.path.getsize(on), os.path.getsize(off)
          delta = on_size - off_size
          only_on = sorted(n for n in on_e if n not in off_e)
          only_off = sorted(n for n in off_e if n not in on_e)
          grown = sorted(((n, on_e[n] - off_e[n]) for n in on_e if n in off_e and on_e[n] != off_e[n]),
                         key=lambda x: -abs(x[1]))

          def kib(b):
              return "%+.1f KiB" % (b / 1024.0) if b else "0"

          lines = ["## Package footprint (define on minus define off, Testbed2022, IL2CPP arm64+armv7)", "",
                   "| APK | bytes |", "|---|---|",
                   "| define ON  (`%s`) | %d |" % (os.path.basename(on), on_size),
                   "| define OFF (`%s`) | %d |" % (os.path.basename(off), off_size),
                   "| **difference** | **%d bytes (%.1f KiB)** |" % (delta, delta / 1024.0), "",
                   "Entries only in the define-on APK (%d):" % len(only_on), ""]
          lines += ["- `%s` — %d bytes" % (n, on_e[n]) for n in only_on] or ["- (none)"]
          lines += ["", "Entries that changed size (uncompressed, top 12):", ""]
          lines += ["- `%s` — %s" % (n, kib(d)) for n, d in grown[:12]] or ["- (none)"]
          if only_off:
              lines += ["", "Entries only in the define-off APK (%d): %s" % (len(only_off), ", ".join("`%s`" % n for n in only_off))]
          report = "\n".join(lines)
          print(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(report + "\n")
          if delta > ceiling:
              raise SystemExit("the package's footprint is %d bytes, above the %d-byte ceiling this job "
                               "holds it to — something new is shipping with the define on." % (delta, ceiling))
          if delta < 0:
              print("note: the define-off APK is the larger one by %d bytes; IL2CPP output is not "
                    "byte-deterministic between builds, so a small negative reading is noise." % -delta)
          print("PASS: footprint %d bytes (%.1f KiB), within the %d-byte ceiling" % (delta, delta / 1024.0, ceiling))
          PY
      - name: Assert the define-off iOS export carries no macro and no marked shortcuts
        env:
          OFF_DIR: Examples~/Testbed2022/Builds/iOSSimulatorNoDefine
          ON_DIR: define-on-ios
        run: |
          set -euo pipefail
          for d in "$OFF_DIR" "$ON_DIR"; do
            [ -d "$d" ] || { echo "missing export directory $d"; ls -la "$(dirname "$d")" 2>/dev/null || true; exit 1; }
          done
          off_pbx="$(find "$OFF_DIR" -type f -name project.pbxproj -path '*Unity-iPhone.xcodeproj*' | head -1)"
          on_pbx="$(find "$ON_DIR" -type f -name project.pbxproj -path '*Unity-iPhone.xcodeproj*' | head -1)"
          if [ -z "$off_pbx" ] || [ -z "$on_pbx" ]; then
            echo "no Unity-iPhone.xcodeproj/project.pbxproj in one of the exports"
            find "$OFF_DIR" "$ON_DIR" -maxdepth 2 -print
            exit 1
          fi
          # `grep -c` exits 1 on zero matches; `|| true` keeps the count as the value.
          on_macro="$(grep -c 'QUICKACTIONS_ENABLED' "$on_pbx" || true)"
          off_macro="$(grep -c 'QUICKACTIONS_ENABLED' "$off_pbx" || true)"
          echo "QUICKACTIONS_ENABLED in the .pbxproj — define on: $on_macro line(s), define off: $off_macro"
          [ "${on_macro:-0}" -gt 0 ] || { echo "CONTROL FAILED: the define-on export carries no QUICKACTIONS_ENABLED macro, so this check cannot see it."; exit 1; }
          [ "${off_macro:-0}" -eq 0 ] || { echo "GATE LEAK: the define-off export still carries the macro:"; grep -n 'QUICKACTIONS_ENABLED' "$off_pbx"; exit 1; }
          python3 - "$ON_DIR/Info.plist" "$OFF_DIR/Info.plist" <<'PY'
          import plistlib
          import sys

          MARKER = "com.emindeniz99.quickactions.managed"

          def marked(path):
              with open(path, "rb") as f:
                  root = plistlib.load(f)
              items = root.get("UIApplicationShortcutItems") or []
              return [d.get("UIApplicationShortcutItemType") for d in items
                      if isinstance(d, dict)
                      and isinstance(d.get("UIApplicationShortcutItemUserInfo"), dict)
                      and d["UIApplicationShortcutItemUserInfo"].get(MARKER) is True], root

          on_ids, _ = marked(sys.argv[1])
          off_ids, off_root = marked(sys.argv[2])
          print("marked UIApplicationShortcutItems — define on: %r, define off: %r" % (on_ids, off_ids))
          if not on_ids:
              raise SystemExit("CONTROL FAILED: the define-on Info.plist has no marked items, so this check cannot see them.")
          if off_ids or "UIApplicationShortcutItems" in off_root:
              raise SystemExit("GATE LEAK: the define-off Info.plist still carries UIApplicationShortcutItems: %r"
                               % off_root.get("UIApplicationShortcutItems"))
          print("PASS: no QUICKACTIONS_ENABLED macro and no shortcut items in the define-off iOS export")
          PY

  # iOS export per testbed on the ubuntu docker image: proves the package's
  # iOS build post-processor (static shortcuts + template-image sync + the
  # {placeholder} pipeline) runs inside a real editor and yields an Xcode
  # project. Simulator SDK on purpose — the compile stage below needs no Apple
  # signing that way.
  ios-export:
    name: ios export (${{ matrix.testbed.name }})
    needs: [license, android-build]
    if: ${{ !cancelled() && needs.license.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.UNITY_MAX_PARALLEL || '2') }}
      matrix:
        testbed:
          - { name: "2021.3", path: Examples~/Testbed2021 }
          - { name: "2022.3", path: Examples~/Testbed2022 }
          - { name: "unity6", path: Examples~/Testbed6 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import the Demo sample into the testbed
        env:
          TESTBED: ${{ matrix.testbed.path }}
        run: |
          mkdir -p "$TESTBED/Assets/Samples/QuickActionsDemo"
          cp -R Samples~/Demo/. "$TESTBED/Assets/Samples/QuickActionsDemo/"
      # Unity 6000.6's editor asks for 1 GB of /dev/shm at start-up (its asset
      # database's UDS client: "Requested 1073741824 bytes, but only 67108864
      # available … run the container with --shm-size=1025M") and aborts without
      # it; Docker's default is 64 MB and GameCI's actions pass no --shm-size, so
      # the daemon's default is raised instead. Merged into the runner's existing
      # daemon.json rather than overwriting it (the image ships cgroup settings
      # there). Same step in every job that runs an editor in a container — the
      # unity6-latest canary was the first to hit it (run 37, 2026-09-01), and
      # the pinned legs will the day a testbed moves to 6.6+.
      - name: Give Unity's container the shared memory 6000.6+ needs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          path = "/etc/docker/daemon.json"
          cfg = json.load(open(path)) if os.path.exists(path) else {}
          cfg["default-shm-size"] = "2g"
          with open("daemon.json.new", "w") as f:
              json.dump(cfg, f, indent=2)
          print(json.dumps(cfg, indent=2))
          PY
          sudo mv daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.Name}}: docker restarted, default shm raised' \
            || { echo "docker did not come back after the restart"; exit 1; }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.testbed.path }}/Library
          key: Library-${{ matrix.testbed.name }}-ios-${{ hashFiles(format('{0}/Packages/**', matrix.testbed.path), format('{0}/ProjectSettings/**', matrix.testbed.path)) }}
          restore-keys: |
            Library-${{ matrix.testbed.name }}-ios-
            Library-${{ matrix.testbed.name }}-
      - uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ matrix.testbed.path }}
          targetPlatform: iOS
          buildMethod: TestbedBuilder.BuildiOSSimulator
          versioning: None
          allowDirtyBuild: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-simulator-xcodeproj-${{ matrix.testbed.name }}
          path: ${{ matrix.testbed.path }}/Builds/iOSSimulator
          if-no-files-found: error
          retention-days: 14
      # The Android legs read their APK back with aapt2; iOS had no equivalent, so
      # the entire iOS bake — the post-processor's UIApplicationShortcutItems, the
      # ownership marker, the icon-key exclusivity — was carried by headless tests
      # against stubs and by nothing that runs a real editor. The compile job below
      # proves the project builds, not that the shortcuts are in it. This asserts
      # the plist Unity actually wrote. Ordering matches the Android leg: the
      # upload above runs FIRST, because this is the step meant to turn red and
      # red must not discard its own evidence.
      - name: Assert the iOS bake reached Info.plist
        env:
          PLIST: ${{ matrix.testbed.path }}/Builds/iOSSimulator/Info.plist
        run: |
          set -euo pipefail
          python3 - "$PLIST" <<'PY'
          import plistlib
          import sys

          # Mirrors QuickActionsPlistShortcuts.MarkerKey — the value is a BOOLEAN
          # under UIApplicationShortcutItemUserInfo, so test it with `is True`
          # rather than key presence.
          MARKER = "com.emindeniz99.quickactions.managed"
          ICON_KEYS = ("UIApplicationShortcutItemIconSymbolName",
                       "UIApplicationShortcutItemIconFile",
                       "UIApplicationShortcutItemIconType")
          EXPECTED = ["new_game", "continue", "daily_reward"]

          path = sys.argv[1]
          with open(path, "rb") as f:
              root = plistlib.load(f)
          items = root.get("UIApplicationShortcutItems") or []

          problems = []
          if not items:
              problems.append("UIApplicationShortcutItems is missing or empty — the "
                              "post-processor baked nothing into %s" % path)
          ours = [d for d in items
                  if isinstance(d, dict)
                  and isinstance(d.get("UIApplicationShortcutItemUserInfo"), dict)
                  and d["UIApplicationShortcutItemUserInfo"].get(MARKER) is True]
          got = [d.get("UIApplicationShortcutItemType") for d in ours]
          if got != EXPECTED:
              problems.append("marked ids/order are %r, expected %r" % (got, EXPECTED))
          for d in ours:
              present = [k for k in ICON_KEYS if k in d]
              if len(present) != 1:
                  problems.append("%s carries %d icon keys %r — iOS accepts exactly one"
                                  % (d.get("UIApplicationShortcutItemType"),
                                     len(present), present))

          if problems:
              print("iOS bake assertion FAILED:")
              for p in problems:
                  print("  -", p)
              print("--- UIApplicationShortcutItems as built ---")
              print(plistlib.dumps(items).decode())
              raise SystemExit(1)
          print("ok: %d marked items %r, exactly one icon key each" % (len(ours), got))
          PY

  # The same iOS export, with a mock HOST stacked on top of the package: an
  # IMPL_APP_CONTROLLER_SUBCLASS subclass, a category +load swizzle of the two
  # app-delegate selectors the package owns, and a GoogleUtilities-style isa proxy
  # of the live delegate — the three shapes every real Unity iOS SDK stack is made
  # of. Sources live in Examples~/Coexistence/iOS (invisible to Unity, never
  # shipped, each file wrapped in #if QUICKACTIONS_ENABLED) and are copied into the
  # testbed here, exactly the way the Demo sample is imported. 2021.3 is absent on
  # purpose: it is exported but never compiled on macOS (x86_64-only simulator
  # runtime), so a coex leg there could assert nothing.
  ios-export-coex:
    name: ios export coex (${{ matrix.testbed.name }})
    needs: [license, ios-export]
    if: ${{ !cancelled() && needs.license.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.UNITY_MAX_PARALLEL || '2') }}
      matrix:
        testbed:
          - { name: "2022.3-coex", base: "2022.3", path: Examples~/Testbed2022 }
          - { name: "unity6-coex", base: "unity6", path: Examples~/Testbed6 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import the Demo sample into the testbed
        env:
          TESTBED: ${{ matrix.testbed.path }}
        run: |
          mkdir -p "$TESTBED/Assets/Samples/QuickActionsDemo"
          cp -R Samples~/Demo/. "$TESTBED/Assets/Samples/QuickActionsDemo/"
      - name: Stack the coexistence mock host into the testbed
        env:
          TESTBED: ${{ matrix.testbed.path }}
        run: |
          set -euo pipefail
          mkdir -p "$TESTBED/Assets/Plugins/iOS"
          cp -R Examples~/Coexistence/iOS/. "$TESTBED/Assets/Plugins/iOS/"
          ls -la "$TESTBED/Assets/Plugins/iOS"
      # Same shared-memory raise as every other containerised editor job.
      - name: Give Unity's container the shared memory 6000.6+ needs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          path = "/etc/docker/daemon.json"
          cfg = json.load(open(path)) if os.path.exists(path) else {}
          cfg["default-shm-size"] = "2g"
          with open("daemon.json.new", "w") as f:
              json.dump(cfg, f, indent=2)
          print(json.dumps(cfg, indent=2))
          PY
          sudo mv daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.Name}}: docker restarted, default shm raised' \
            || { echo "docker did not come back after the restart"; exit 1; }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.testbed.path }}/Library
          key: Library-${{ matrix.testbed.name }}-ios-${{ hashFiles(format('{0}/Packages/**', matrix.testbed.path), format('{0}/ProjectSettings/**', matrix.testbed.path)) }}
          # Falls back to the plain leg's Library for this testbed: the mock host
          # adds four sources, not a different project.
          restore-keys: |
            Library-${{ matrix.testbed.name }}-ios-
            Library-${{ matrix.testbed.base }}-ios-
            Library-${{ matrix.testbed.base }}-
      - uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ matrix.testbed.path }}
          targetPlatform: iOS
          buildMethod: TestbedBuilder.BuildiOSSimulator
          versioning: None
          allowDirtyBuild: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-simulator-xcodeproj-${{ matrix.testbed.name }}
          path: ${{ matrix.testbed.path }}/Builds/iOSSimulator
          if-no-files-found: error
          retention-days: 14

  # Compile the exported project for the iOS Simulator on macOS — unsigned
  # (CODE_SIGNING_ALLOWED=NO), then boot a simulator, install the .app and
  # launch it, asserting the process is still alive afterwards (`simctl
  # launch` exiting 0 only means the spawn was accepted). 2021.3 is exported
  # above but deliberately NOT compiled here: that line's simulator support is
  # x86_64-only (see README "Status") while current macOS runners ship
  # arm64-only iOS 26 runtimes, and its IL2CPP output needs ld_classic
  # workarounds under Xcode 15+ — a red job there would say nothing about the
  # package. 2022.3 gets macos-15 (Xcode 16.4 default); Unity 6 gets the
  # current macos-latest (Xcode 26).
  ios-simulator:
    name: ios simulator (${{ matrix.target.name }})
    needs: ios-export
    # Same per-leg gating as android-smoke — doubly needed here, since this
    # job never consumes the 2021.3 export at all and must not be skipped by
    # that leg failing.
    if: ${{ !cancelled() && needs.ios-export.result != 'skipped' }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: "2022.3", runner: macos-15 }
          - { name: "unity6", runner: macos-latest }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-simulator-xcodeproj-${{ matrix.target.name }}
          path: ${{ runner.temp }}/iosproj
      - name: xcodebuild for the iOS Simulator (unsigned)
        run: |
          cd "$RUNNER_TEMP/iosproj"
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Boot a simulator, install and launch the app
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$APP" ] || { echo "no .app produced"; exit 1; }
          UDID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["udid"]); raise SystemExit
          raise SystemExit("no available iPhone simulator")')"
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.quickactions.testbed
          # `launch` exit 0 only proves the spawn; give the app time to crash,
          # then require its process to still be registered. Capture-then-case,
          # never `| grep -q`: under pipefail an early grep exit SIGPIPEs
          # launchctl into a spurious failure (same rule as the adb smoke).
          sleep 15
          LIST="$(xcrun simctl spawn "$UDID" launchctl list)"
          case "$LIST" in
            *com.quickactions.testbed*) ;;
            *)
              echo "app is no longer running — crashed after launch"
              ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
              exit 1
              ;;
          esac
          echo "app launched and stayed alive on the simulator"

  # The coexistence assertions. Same compile as ios-simulator, then the app is
  # launched with its stderr on a pty — which is what makes NSLog duplicate to it —
  # and every line the mock host prints is required by name. `QA-COEX: FAIL`
  # anywhere fails the leg, a missing `QA-COEX: DONE` fails it (a probe that never
  # ran must not pass by silence), and the package's own always-on install line has
  # to say exactly what this lifecycle should produce. On a scene-manifest testbed
  # the app is launched a second time with SIMCTL_CHILD_QA_COEX_SHADOW_SCENE_CONFIG=1,
  # where the host subclass shadows application:configurationForConnectingSceneSession:
  # without calling super — the only route left is the UISceneWillConnectNotification
  # fallback, so the install line must flip from "via configuration" to
  # "via notification". One build, two behaviours, no second export.
  ios-simulator-coex:
    name: ios simulator coex (${{ matrix.target.name }})
    needs: ios-export-coex
    if: ${{ !cancelled() && needs.ios-export-coex.result != 'skipped' }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          # `lifecycle` and `hooks` are EXPECTATIONS, not descriptions: Testbed2022 is
          # 2022.3.62f3, below the 2022.3.72f1 cut where Unity starts emitting a scene
          # manifest, and Testbed6 is 6000.3.21f1, above the 6000.3.8f1 cut. If a leg
          # goes red on these, the answer is which lifecycle CI actually exercises.
          # The first run (2026-09-02) established both: the app-delegate lifecycle
          # on 2022.3 and the scene lifecycle on 6000.3.21f1, hooks installed via
          # configuration and, shadowed, via notification. `hooks` names only the
          # sceneConfig and manifest branches: `performAction=` is deliberately NOT
          # pinned, because that run also showed the mock category's +load running
          # BEFORE the package's class +load on 2022.3 and AFTER it on Unity 6 (every
          # file in UnityFramework both times), so the package prints "added" or
          # "wrapped" depending on the toolchain and composes either way — which is
          # what the chain and exactly-once checks assert.
          - {
              name: "2022.3-coex",
              runner: macos-15,
              lifecycle: "app-delegate",
              hooks: "sceneConfig=absent manifest=no",
            }
          - {
              name: "unity6-coex",
              runner: macos-latest,
              lifecycle: "scene",
              hooks: "sceneConfig=added manifest=yes",
            }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-simulator-xcodeproj-${{ matrix.target.name }}
          path: ${{ runner.temp }}/iosproj
      - name: xcodebuild for the iOS Simulator (unsigned)
        run: |
          cd "$RUNNER_TEMP/iosproj"
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Boot a simulator and run the coexistence mock host
        env:
          EXPECT_LIFECYCLE: ${{ matrix.target.lifecycle }}
          EXPECT_HOOKS: ${{ matrix.target.hooks }}
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$APP" ] || { echo "no .app produced"; exit 1; }
          UDID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["udid"]); raise SystemExit
          raise SystemExit("no available iPhone simulator")')"
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p "$RUNNER_TEMP/coex"

          # One launch, captured through a pty. No `timeout(1)`: that is GNU
          # coreutils, which is not on a macOS runner's PATH — background the launch
          # and kill it instead. Poll capture-then-case, never `| grep -q`: under
          # pipefail an early grep exit SIGPIPEs the writer (same rule as the adb
          # smoke and the plain simulator leg).
          run_launch() {
            mode="$1"; out="$2"
            : > "$out"
            if [ -n "$mode" ]; then
              SIMCTL_CHILD_QA_COEX_SHADOW_SCENE_CONFIG="$mode" \
                xcrun simctl launch --console-pty --terminate-running-process \
                  "$UDID" com.quickactions.testbed > "$out" 2>&1 &
            else
              xcrun simctl launch --console-pty --terminate-running-process \
                "$UDID" com.quickactions.testbed > "$out" 2>&1 &
            fi
            launch_pid=$!
            waited=0
            while [ "$waited" -lt 120 ]; do
              text="$(cat "$out" 2>/dev/null || true)"
              case "$text" in *"QA-COEX: DONE"*) break ;; esac
              waited=$((waited + 1))
              sleep 1
            done
            kill "$launch_pid" 2>/dev/null || true
            wait "$launch_pid" 2>/dev/null || true
            xcrun simctl terminate "$UDID" com.quickactions.testbed >/dev/null 2>&1 || true
            echo "launch (mode=${mode:-default}) captured $(wc -l < "$out") line(s) after ${waited}s"
          }

          # Only on failure, and never asserted on: the unified log is per-device, so
          # it also holds the PREVIOUS launch's lines and would let one launch pass on
          # another's evidence. The pty capture is the source of truth.
          fail_dump() {
            echo "----- console capture -----"
            cat "$1" || true
            echo "----- unified log (best effort, may span earlier launches) -----"
            xcrun simctl spawn "$UDID" log show --style compact --last 5m \
              --predicate 'processImagePath CONTAINS "QuickActionsDemo"' 2>/dev/null || true
          }

          assert_log() {
            file="$1"; label="$2"; shift 2
            text="$(cat "$file")"
            case "$text" in
              *"QA-COEX: FAIL"*)
                echo "::error::$label — the mock host reported a failure"
                fail_dump "$file"; exit 1 ;;
            esac
            case "$text" in
              *"QA-COEX: DONE"*) ;;
              *) echo "::error::$label — the probe never finished"; fail_dump "$file"; exit 1 ;;
            esac
            for want in "$@"; do
              case "$text" in
                *"$want"*) ;;
                *)
                  echo "::error::$label — missing required line: $want"
                  fail_dump "$file"; exit 1 ;;
              esac
            done
            echo "$label — every required line present"
          }

          required=(
            "[QuickActions] iOS hooks: didFinishLaunching=wrapped performAction="
            "$EXPECT_HOOKS"
            "QA-COEX: PASS lifecycle-$EXPECT_LIFECYCLE"
            "QA-COEX: PASS category-load-ran"
            "QA-COEX: PASS cold-returns-no"
            "QA-COEX: PASS cold-queued-id"
            "QA-COEX: PASS cold-warm-dedup"
            "QA-COEX: PASS cold-warm-dedup-completion-once"
            "QA-COEX: PASS subclass-super-called-once"
            "QA-COEX: PASS category-cold-chained"
            "QA-COEX: PASS isa-proxy-size-equal"
            "QA-COEX: PASS isa-proxy-warm-hook-resolves"
            "QA-COEX: PASS isa-proxy-installed"
            "QA-COEX: PASS isa-proxy-warm-reaches-package"
            "QA-COEX: PASS category-warm-chained"
            "QA-COEX: PASS warm-queued-id"
            "QA-COEX: PASS warm-queued-once"
            "QA-COEX: PASS warm-completion-once"
            "QA-COEX: PASS unmarked-completion-once"
          )
          if [ "$EXPECT_LIFECYCLE" = "scene" ]; then
            required+=(
              "QA-COEX: PASS scene-delegate-is-unityscene"
              "QA-COEX: PASS scene-config-delegate-class"
              "QA-COEX: PASS scene-warm-hook-installed"
            )
          fi

          run_launch "" "$RUNNER_TEMP/coex/launch-default.log"
          if [ "$EXPECT_LIFECYCLE" = "scene" ]; then
            assert_log "$RUNNER_TEMP/coex/launch-default.log" "default launch" \
              "${required[@]}" \
              "[QuickActions] iOS scene hooks installed on UnityScene via configuration"
            run_launch "1" "$RUNNER_TEMP/coex/launch-shadowed.log"
            assert_log "$RUNNER_TEMP/coex/launch-shadowed.log" "shadowed-configuration launch" \
              "${required[@]}" \
              "[QuickActions] iOS scene hooks installed on UnityScene via notification"
          else
            assert_log "$RUNNER_TEMP/coex/launch-default.log" "default launch" "${required[@]}"
          fi
          echo "coexistence assertions passed for ${{ matrix.target.name }}"
      # if: always() rather than the usual upload-first ordering — the logs are
      # produced by the step above, so this is the only way a red leg keeps its
      # evidence.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ios-coex-logs-${{ matrix.target.name }}
          path: ${{ runner.temp }}/coex
          if-no-files-found: warn
          retention-days: 14

