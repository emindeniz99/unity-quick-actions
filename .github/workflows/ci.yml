name: CI

# Unity asset verified WITHOUT Unity: tools~/verify.sh generates .meta files,
# compiles the C# against UnityEngine/UnityEditor stubs (10 configs), runs the
# NUnit suite via `dotnet test`, compiles the Android plugin against Android SDK
# stubs, and checks the frozen device strings, the release-notes coherence and
# the generated Android icon bytes. The iOS .mm and on-device behaviour still
# need a real Unity build (see PRODUCTION_READINESS.md). See .verify/README.md.
#
# On a pushed `v*` tag the same commit is verified and the `release` job packs
# dist~/QuickActions.unitypackage and attaches it to the GitHub Release. The
# artifact is a BUILD OUTPUT and is not committed (dist~/ is gitignored).

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; only `release` widens this, in its own block.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify (7 checks — meta, 10 C# configs, unit tests, Android plugin, frozen strings, release notes, icon bytes)
        run: tools~/verify.sh
      - name: Pack .unitypackage (reproducible, no Unity needed)
        run: python3 tools~/pack_unitypackage.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: QuickActions.unitypackage
          path: dist~/QuickActions.unitypackage
          if-no-files-found: error

  # unity-ci.yml's comments lean on actionlint ("actionlint shellchecks every
  # run: block in this workflow"); this is the job that makes that true in CI
  # rather than on whoever remembers to run it locally. The official image
  # carries shellcheck and pyflakes, so every run: block gets both passes.
  # The second step guards the one hand-maintained duplication in that file:
  # its push and pull_request paths filters must stay identical (a YAML
  # anchor would do it, but actionlint cannot resolve the alias).
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (shellcheck + pyflakes over every run block)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: unity-ci.yml push and pull_request paths filters are identical
        run: |
          python3 - <<'PY'
          import re
          import sys

          text = open(".github/workflows/unity-ci.yml", encoding="utf-8").read()
          block = r"^  {0}:\n(?:    branches: \[main\]\n)?    paths:\n((?:      - .*\n)+)"
          found = {}
          for event in ("push", "pull_request"):
              m = re.search(block.format(event), text, re.M)
              if not m:
                  sys.exit(f"could not find the {event} paths filter — the layout this check parses has changed")
              found[event] = m.group(1).splitlines()
          if found["push"] != found["pull_request"]:
              print("push:", *found["push"], sep="\n  ")
              print("pull_request:", *found["pull_request"], sep="\n  ")
              sys.exit("unity-ci.yml: the push and pull_request paths filters differ — keep them identical")
          print(f"ok: both paths filters list the same {len(found['push'])} patterns")
          PY

  # Tag pushes only. Runs after `verify`, so nothing is published from a commit
  # that does not compile and pass its tests. Packs from a clean checkout with
  # no restored cache — a poisoned cache must not be able to become the
  # published artifact — and the packer is pure Python stdlib, so no toolchain
  # is installed here at all.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack .unitypackage
        run: python3 tools~/pack_unitypackage.py
      # `gh` is preinstalled on the runner, so this needs no third-party action.
      # The tag reaches the shell through env, never an inline ${{ }} expansion.
      # Works whether or not the Release already exists: created from the UI
      # first, or created here from the tag with generated notes.
      - name: Attach the .unitypackage to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist~/QuickActions.unitypackage --clobber
          else
            # Publish the CURATED CHANGELOG section, the same notes release.yml
            # uses — --generate-notes would ship a commit list instead, which is
            # not what MAINTAINING promises a reader of a release page. Guard the
            # pairing first: release_notes.py reads package.json's version, and a
            # tag naming a different one would attach the wrong section.
            EXPECTED="v$(python3 tools~/release_notes.py --version)"
            if [ "$TAG" != "$EXPECTED" ]; then
              echo "::error::$TAG does not match package.json ($EXPECTED) — the curated notes would describe the wrong version."
              exit 1
            fi
            python3 tools~/release_notes.py > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" dist~/QuickActions.unitypackage \
              --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
